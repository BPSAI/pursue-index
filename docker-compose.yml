services:
  postgres:
    image: postgres:16-alpine
    container_name: pursue-postgres
    environment:
      POSTGRES_USER: pursue
      # dev-only credential; rotate before any networked exposure
      POSTGRES_PASSWORD: pursue
      POSTGRES_DB: pursue
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursue -d pursue"]
      interval: 5s
      timeout: 5s
      retries: 5
