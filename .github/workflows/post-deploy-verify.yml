name: Post-deploy verify

# Runs Phase 8 of the site-release runbook after every push to main:
# waits for THIS commit's Workers Builds check run (name: WORKERS_BUILD_CHECK_NAME
# below) -- or a successful manual deploy-cf.yml fallback run -- to
# complete successfully, confirms the live site's /deploy-stamp.json names
# this commit, then HEAD-checks homepage / methodology / sample card pages
# on pursueindex.com. If anything fails, opens a `deploy-broken` issue.
#
# This is the safety net that catches anything `make ship-ready`
# missed — e.g., a worker-route change that builds locally but fails in
# production, or a CF Pages env-var drift.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override base URL (default https://pursueindex.com)"
        required: false
        default: "https://pursueindex.com"
      max_wait_secs:
        description: "Max polling time in seconds"
        required: false
        default: "600"
      skip_build_wait:
        description: "Skip only the build wait (manual runs with no build for this sha); the deployed-commit check still runs"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  actions: read   # list deploy-cf.yml fallback runs for this sha
  issues: write

env:
  # The one place the build's check-run name is defined.
  WORKERS_BUILD_CHECK_NAME: "Workers Builds: pursue-index"
  # GitHub App id of cloudflare-workers-and-pages; a same-name run from another app is ignored.
  WORKERS_BUILD_APP_ID: "85455"
  # Inputs reach scripts only through env (never interpolated into run:).
  BASE_URL: ${{ inputs.base_url || 'https://pursueindex.com' }}
  MAX_WAIT_SECS: ${{ inputs.max_wait_secs || '600' }}

concurrency:
  # Only one verify per branch at a time; new pushes cancel in-progress
  group: post-deploy-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Post-deploy URL verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.4.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Validate dispatch inputs
        run: python scripts/validate_base_url.py

      - name: Report build-wait mode
        env:
          SKIP_BUILD_WAIT: ${{ inputs.skip_build_wait || 'false' }}
        run: |
          echo "event=$GITHUB_EVENT_NAME skip_build_wait=$SKIP_BUILD_WAIT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SKIP_BUILD_WAIT" = "true" ]; then
            echo "::warning title=build wait skipped::skip_build_wait is set: not waiting for this commit's build; the deployed-commit check still runs"
          fi

      - name: Wait for this commit's build
        id: wait
        # Pushes never skip: either the Workers Builds check run or a manual
        # deploy-cf.yml run on github.sha must complete with success (a missing
        # run is a failure), so a broken or still-running build cannot read
        # green. A build cancelled/skipped with main strictly ahead reports `superseded`
        # (exit 0) and the stamp/URL steps below are skipped.
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_build_wait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/wait_for_check_run.py \
            --sha "${{ github.sha }}" \
            --timeout-secs 1200

      - name: Confirm the deployed build is this commit
        id: stamp
        if: steps.wait.outputs.superseded != 'true'
        run: |
          python scripts/check_deployed_commit.py \
            --sha "${{ github.sha }}" \
            --base-url "$BASE_URL" \
            --timeout-secs 300

      - name: Run verify-deploy
        if: steps.wait.outputs.superseded != 'true'
        run: |
          python scripts/runbook_verify_deploy.py \
            --base-url "$BASE_URL" \
            --max-wait-secs "$MAX_WAIT_SECS"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@e69ef5462fd455e02edcaf4dd7708eda96b9eda0
        with:
          script: |
            const commit_sha = context.sha;
            // A 403 on every stamp read is the CDN refusing the runner, not a
            // broken deploy: file it under its own title, without deploy-broken.
            const edgeBlocked = '${{ steps.stamp.outputs.edge_blocked }}' === 'true';
            const short = commit_sha.substring(0, 8);
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `post-deploy verify failed for commit ${short}.`,
              ``,
              `Workflow run: ${run_url}`,
              ``,
              `Likely causes:`,
              `- the Workers Builds check run failed, never appeared, or took >20 min`,
              `- the live site is still serving an older deploy (/deploy-stamp.json)`,
              `- pages.json / manifest / cards-summary out of sync at deploy time`,
              `- Worker route gap (e.g., new asset_type without route coverage)`,
              ``,
              `Next steps:`,
              `1. Check the Workers Builds log for this commit`,
              `2. Re-run the failing workflow if the build just took too long`,
              `3. If failures persist, run \`make verify-deploy\` locally + investigate`,
            ].join('\n');
            if (edgeBlocked) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `deploy-verify-blocked: the edge refused /deploy-stamp.json (HTTP 403) at ${short}`,
                body: [
                  `post-deploy verify could not read /deploy-stamp.json for commit ${short}:`,
                  `every request was refused with HTTP 403 by the edge, so the deployed`,
                  `commit is unknown. This is not evidence of a broken deploy.`,
                  ``,
                  `Workflow run: ${run_url}`,
                  ``,
                  `Check the edge's security events for the runner's requests to`,
                  `/deploy-stamp.json, then re-run the workflow.`,
                ].join('\n'),
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `deploy-broken: post-deploy verify failed at ${short}`,
              body: body,
              labels: ['deploy-broken'],
            });
