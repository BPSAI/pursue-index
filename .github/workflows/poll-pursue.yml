name: Poll PURSUE for new tranches

# Runs the lightweight poll on a 6-hour cadence. The script fetches the
# upstream CSV via curl_cffi (Chrome-TLS impersonation), hashes it, and
# compares to the committed last-known-sha. On change, it commits the new
# sha and opens a `tranche-detected` issue. On fetch failure (Akamai 4xx,
# transport error, empty body) it opens a `tranche-poll-failure` issue and
# the job fails so the operator gets a workflow-failure email too.
#
# Why this layer: detection lives on infra DOW doesn't control. If the
# poll starts failing, that's an early warning to investigate. If it
# silently stops detecting, the next operator-attended run will catch up
# but we'll have lost the canonical-archive lead.
#
# A second observability lane — the PDF-fetch health check — runs
# after the CSV poll and uses the same curl_cffi Chrome-impersonate
# path. If Akamai ever tightens PDF gating without touching the CSV
# (or vice versa), one lane will fail while the other stays green
# and we'll know within 6 hours instead of finding out from a failed
# operator-attended download stage. Both lanes feed the same
# `gh issue create` pipeline so the alert pathway stays unified.
#
# Operational dependencies (SEC-004):
# * Direct push: the "Commit new sha" step pushes straight to `main`
#   using the auto-provisioned `GITHUB_TOKEN`. If branch protection is
#   later enabled on `main` requiring PRs/reviews, this push will fail
#   and the sha update will be lost. Either keep `github-actions[bot]`
#   exempt from those rules, or rework this step to open a PR.
# * Bot commit surface: the bot writes BOTH
#   `data/last-known-csv-sha.txt` (the canonical state file) AND
#   `data/raw/csv/<sha>.csv` (the content-addressed byte archive,
#   added 2026-05-11 to plug the integrity gap where transient
#   upstream states between attended scrapes were unrecoverable).
#   The byte archive is committed on every detected change so the
#   public record always has the bytes that produced the recorded
#   sha. Both files share the same fast-forward push lane.
# * Action pinning: `actions/checkout` and `actions/setup-python` are
#   pinned to commit SHAs (SEC-001). Bumps land via Dependabot
#   (`.github/dependabot.yml`, `github-actions` ecosystem).
# * Pip install is hash-locked via `requirements-poll.txt` (SEC-002).
#   Regenerate with:
#     pip-compile --generate-hashes -o requirements-poll.txt \
#       requirements-poll.in

on:
  schedule:
    # Every 30 minutes UTC. Bumped from 6h on 2026-05-11 after the
    # f07601eb tranche (which lived ~5 hours on war.gov) was lost to
    # the 6h cadence — a transient state shorter than the polling
    # window has zero chance of being caught. 30 min keeps us under
    # GitHub Actions' free-tier minute budget (the public-repo tier
    # is unlimited anyway) and is short enough that the typical
    # tranche-shape window is captured. If upstream behavior tightens
    # further, drop to */15 — the poll itself runs ~30s and the only
    # real ceiling is rate-limiting from war.gov on the Akamai edge,
    # which has not been observed at any cadence we've tested.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit data/last-known-csv-sha.txt on change
  issues: write     # open tranche-detected / tranche-poll-failure issues

concurrency:
  # Shared with verify-assets-daily.yml so the two registry-writing
  # workflows serialize on the same lock (nayru P1). Both append to
  # data/asset-bytes-registry.jsonl and push to main; running them
  # concurrently is a recipe for losing one workflow's appended
  # rows during rebase resolution. GitHub Actions only runs one job
  # per group at a time within a repo.
  group: pursue-registry-writers
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Promote the poll step's outputs to job level so the downstream
    # `snapshot` job (T6.2) can gate on a detected change and read the
    # new sha. Without this block, `needs.poll.outputs.*` resolves empty
    # and the snapshot lane would never fire.
    outputs:
      status: ${{ steps.poll.outputs.status }}
      new_sha: ${{ steps.poll.outputs.new_sha }}
      old_sha: ${{ steps.poll.outputs.old_sha }}
      is_bootstrap: ${{ steps.poll.outputs.is_bootstrap }}
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Shallow checkout is fine — we make a single fast-forward
          # commit and rebase before push if main advanced concurrently.
          fetch-depth: 1

      # actions/setup-python v6.2.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Ensure issue labels exist
        # `gh issue create --label foo` exits non-zero when `foo` doesn't
        # exist on the repo, which would mask the structured payload the
        # poll script emits. `gh label create --force` is idempotent, so
        # this is safe to run on every invocation.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tranche-detected \
            --color 0E8A16 \
            --description "Upstream PURSUE CSV changed; operator should run heavy ingest" \
            --force
          gh label create tranche-poll-failure \
            --color D93F0B \
            --description "The auto-poll workflow could not fetch/parse the upstream CSV" \
            --force
          gh label create pdf-health-failure \
            --color D93F0B \
            --description "The 6h cron sentinel PDF fetch failed (likely Akamai gating shift)" \
            --force

      - name: Install minimal scrape deps
        # Hash-locked install (SEC-002). Source list:
        # `requirements-poll.in`; resolved + hashed:
        # `requirements-poll.txt`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-poll.txt

      - name: Run poll
        id: poll
        run: python scripts/poll_pursue.py
        # Don't `set -e` out here — script exits 1 on fetch failure and we
        # still want the issue-opening step to fire before failing the job.
        continue-on-error: true

      - name: Commit new sha + CSV bytes (when changed)
        if: steps.poll.outputs.status == 'changed'
        env:
          OLD_SHA: ${{ steps.poll.outputs.old_sha }}
          NEW_SHA: ${{ steps.poll.outputs.new_sha }}
          IS_BOOTSTRAP: ${{ steps.poll.outputs.is_bootstrap }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-known-csv-sha.txt
          # The poll script writes the fetched bytes to
          # data/raw/csv/<sha>.csv at fetch time. Stage it so the
          # canonical byte record lands in git alongside the sha update.
          # Content-addressed naming means duplicates self-resolve: if
          # the file is already tracked from a prior run, git add is a
          # no-op. (Plugs the f07601eb-style integrity gap.)
          if [ -d data/raw/csv ]; then
            git add data/raw/csv/*.csv 2>/dev/null || true
          fi
          if [ "$IS_BOOTSTRAP" = "true" ]; then
            MSG="chore(poll): bootstrap last-known sha ${NEW_SHA:0:12}"
          else
            MSG="chore(poll): upstream CSV changed ${OLD_SHA:0:12} -> ${NEW_SHA:0:12} (+bytes)"
          fi
          git commit -m "$MSG"
          # Rebase against any concurrent advance of main (e.g. a human
          # merge between checkout and push). Without this, fetch-depth: 1
          # plus a bare push races on non-fast-forward. (vaivora P1#2)
          git pull --rebase origin main
          git push

      - name: Archive CSV bytes on every poll (idempotent)
        # On UNCHANGED polls, the poll script still wrote the bytes to
        # data/raw/csv/<sha>.csv (idempotent — same content == same
        # filename, write skips if file exists). The "changed" branch
        # above already commits anything new. This step handles the
        # one-shot bootstrap case: the very first poll after this
        # change lands, the current upstream sha's bytes might not
        # yet be in git from any prior run. Commit them then.
        # Safe to no-op on every subsequent run.
        if: steps.poll.outputs.status == 'unchanged'
        env:
          SHA: ${{ steps.poll.outputs.new_sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/raw/csv ]; then
            git add data/raw/csv/*.csv 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(poll): backfill CSV bytes for ${SHA:0:12}"
            git pull --rebase origin main
            git push
          else
            echo "No new CSV bytes to commit (already in git)."
          fi

      # ----------------------------------------------------------------
      # Asset archive lane (added 2026-05-11). Content-addresses every
      # referenced PDF/IMG to Cloudflare R2 under archive/<byte_sha>.<ext>
      # so a silent same-URL-different-bytes overlay can't fool the
      # archive. Maintains data/asset-bytes-registry.jsonl as the audit
      # log. Runs on ANY poll (changed or unchanged) because the
      # per-card HEAD pre-flight short-circuits unchanged assets cheaply.
      #
      # Required repo secrets (operator action to set up):
      #   R2_ACCESS_KEY_ID
      #   R2_SECRET_ACCESS_KEY
      #   CF_ACCOUNT_ID            (less sensitive; could be a vars
      #                             instead of secrets, but kept in
      #                             secrets for path simplicity)
      #
      # If any of those are missing the script exits 0 cleanly so the
      # workflow doesn't fail. Add them in:
      #   Repo → Settings → Secrets and variables → Actions
      # then re-run the workflow (workflow_dispatch) or wait for the
      # next 30-minute cron tick.
      # ----------------------------------------------------------------
      - name: Install asset-archive deps
        # Hash-pinned via requirements-archive.txt (SEC-001 fix for the
        # supply-chain weakness laverna flagged — this lane runs with
        # R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY in its env, so any
        # un-pinned dep is a write-the-bucket attack vector). Skipped
        # on unchanged/failed so we don't make a broken poll worse and
        # don't HEAD 130 URLs on every quiet 30-min tick.
        if: steps.poll.outputs.status == 'changed'
        run: |
          python -m pip install --require-hashes -r requirements-archive.txt

      - name: Run R2 asset archive
        # Runs ONLY on detected CSV change. The CSV is the primary
        # signal — if the upstream listing didn't change, the assets
        # almost certainly didn't either, and HEADing 130 war.gov URLs
        # every 30 min would be ~6k requests/day against Akamai with
        # no payoff. A daily byte-verify pass (separate workflow,
        # follow-up) catches silent same-URL-different-bytes overlays
        # that the CSV poll cannot.
        id: r2_archive
        if: steps.poll.outputs.status == 'changed'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/r2_archive_assets.py
        continue-on-error: true

      - name: Commit registry updates (when archive ran)
        # The registry is append-only. Commit any new rows the archive
        # script produced. Idempotent — git diff is empty if no new
        # rows landed.
        #
        # Sprint 4e: after staging the registry, refresh
        # ``data/registry-root.txt`` + ``data/registry-root-manifest.txt``
        # in lockstep. The on-promote workflow watches both registry
        # and root file paths; a bot append without the matching root
        # bump would paint the next push red (vaivora H1 / nayru H1.2).
        # The signing-stale issue lane in verify-assets-daily.yml
        # picks up the "root advanced past the last signed tag"
        # state and pings the operator to sign a fresh tag.
        if: steps.r2_archive.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/asset-bytes-registry.jsonl ]; then
            python scripts/registry_root.py
            git add data/asset-bytes-registry.jsonl \
                    data/registry-root.txt \
                    data/registry-root-manifest.txt
          fi
          if ! git diff --cached --quiet; then
            new_rows=$(git diff --cached -- data/asset-bytes-registry.jsonl | grep -c '^+{')
            git commit -m "chore(poll): r2 archive +${new_rows} byte-sha row(s)"
            git pull --rebase origin main
            git push
          else
            echo "No new registry rows."
          fi

      - name: Open tranche-detected issue
        # Skip the issue on bootstrap — there's no actual change to alert on,
        # we just hadn't been watching yet.
        if: steps.poll.outputs.status == 'changed' && steps.poll.outputs.is_bootstrap == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.poll.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.poll.outputs.issue_body }}
          ISSUE_LABELS: ${{ steps.poll.outputs.issue_labels }}
        run: |
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body  "$ISSUE_BODY" \
            --label "$ISSUE_LABELS"

      - name: Open tranche-poll-failure issue
        # Fire on either the script-emitted status OR a hard step failure
        # (e.g. import/runtime error before $GITHUB_OUTPUT is written).
        # Without the outcome check, a crash that bypasses the output
        # file would silently disable failure alerting. (Codex P1)
        if: steps.poll.outputs.status == 'failed' || steps.poll.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fall back to a generic title/body when the script crashed
          # before emitting outputs.
          ISSUE_TITLE: ${{ steps.poll.outputs.issue_title || 'PURSUE poll crashed (no structured output)' }}
          ISSUE_BODY: ${{ steps.poll.outputs.issue_body || 'The poll script exited with a non-zero status before writing $GITHUB_OUTPUT. See the workflow run log for details.' }}
          ISSUE_LABELS: ${{ steps.poll.outputs.issue_labels || 'tranche-poll-failure' }}
        run: |
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body  "$ISSUE_BODY" \
            --label "$ISSUE_LABELS"

      # PDF surveillance lane is independent of CSV: continue-on-error on both
      # steps means a PDF crash never suppresses CSV issue creation, and vice
      # versa. Ordering after CSV is purely for log-readability — readers
      # triaging an outage want CSV results above PDF results in the run log.
      - name: Run PDF-fetch health check
        # Sentinel-PDF ping via the same curl_cffi Chrome-impersonate
        # path the CSV fetcher uses. Catches PDF-only Akamai gating
        # shifts that the CSV poll would miss. `continue-on-error` so
        # the issue-opening step can still fire on failure.
        #
        # `if: always()` keeps PDF surveillance independent: if a CSV-side
        # step (e.g., a `gh issue create` 422) hard-fails earlier, the
        # default `success()` gate would otherwise skip this step and we
        # would lose the PDF lane on the very runs where it matters most.
        # Codex P2 review (2026-05-10).
        #
        # Like scripts/poll_pursue.py, this script sys.path-injects
        # `src/` itself so it works under the lean
        # `requirements-poll.txt` install (no full `pursue` CLI dep).
        id: pdf_health
        if: ${{ always() }}
        run: python scripts/pdf_health_check.py
        continue-on-error: true

      - name: Open pdf-health-failure issue
        # Fires whenever the sentinel fetch fails. The body links the
        # operator straight to the workflow log; the curl_cffi shared
        # path means the CSV fetcher is also worth a re-check (a
        # gate that broke PDFs may break CSVs next).
        #
        # Dedup guard (laverna SEC-001): without a search-before-create
        # check, every failing 6h cron tick opens a NEW issue. After 24
        # hours of an outage the operator has 4+ duplicate issues and
        # the alert lane gets ignored. Skip creation if an open issue
        # with the label already exists.
        if: steps.pdf_health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label pdf-health-failure --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "open pdf-health-failure issue already exists (#$existing); skipping creation"
            exit 0
          fi
          BODY=$(cat <<EOF
          The 6h cron's sentinel PDF fetch failed.

          This is the canary for PDF-side Akamai gating: the same
          curl_cffi Chrome-impersonate path that the CSV fetcher uses.
          If this is failing but the CSV poll passed, Akamai likely
          tightened gating on the medialink/PDF download path
          specifically. If both are failing, the shared TLS/header
          contract is the suspect.

          Run log: $RUN_URL

          Triage:
          1. Pull the workflow log; the failing step prints
             pdf-health.fail url=<url> status=<n> error=<msg> on stderr.
          2. Re-run 'pursue scrape fetch-raw' locally — if that also
             4xxs, the gate moved on the shared path.
          3. If only PDFs are 4xx, compare the Range/Referer headers
             in src/pursue_index/scrape/pdf_health.py against the
             download stage and bring them into agreement.
          EOF
          )
          gh issue create \
            --title "[health] PDF fetch failed (sentinel ping)" \
            --label "pdf-health-failure" \
            --body "$BODY"

      - name: Propagate failure exit code
        # Workflow goes red on EITHER failure mode (CSV poll OR PDF health).
        # Without this, a green checkmark could ship while one of the two
        # surveillance lanes was actively broken.
        if: steps.poll.outputs.status == 'failed' || steps.poll.outcome == 'failure' || steps.pdf_health.outcome == 'failure'
        run: exit 1

  # ==================================================================
  # Snapshot + diff lane (Sprint 6, T6.2) — CREDENTIAL-ISOLATED.
  #
  # On a detected CSV change, runs the T6.1 offline generator
  # (scripts/poll_snapshot.py) to materialize BOTH sides of the
  # DiffIsland diff — it rotates the prior data/manifests/latest.json
  # into snapshots/<old_sha>.json and writes the new
  # snapshots/<new_sha>.json (canonical + public mirrors) — then
  # commits those JSON artifacts to main.
  #
  # WHY A SEPARATE JOB (the load-bearing hardening rationale):
  # this lane runs as its own job with NO R2_ACCESS_KEY_ID /
  # R2_SECRET_ACCESS_KEY / CF_ACCOUNT_ID anywhere in its env. The
  # asset-archive lane in the `poll` job above needs those R2/CF write
  # credentials to push PDF/IMG bytes to the bucket; this snapshot lane
  # only reads the already-committed CSV bytes and writes JSON manifests
  # back to git. Splitting it into a distinct job/runner guarantees —
  # structurally, not by convention — that a supply-chain compromise of
  # the lean poll-deps lane (requirements-poll.txt) cannot reach the R2
  # bucket: the bucket secrets are simply not present in this runner's
  # environment. Same isolation logic that keeps the credentialed
  # archive step gated and pinned (SEC-001/002), applied at job scope.
  #
  # SERIALIZATION: the whole workflow is already bound to the
  # `pursue-registry-writers` concurrency group (top-level `concurrency:`),
  # so this job is serialized across runs against the other
  # registry-writing workflows. Intra-run ordering against the poll job's
  # own sha/bytes push comes from `needs: poll` (which also exposes the
  # poll outputs). A job-level `concurrency:` re-declaring the SAME group
  # is deliberately NOT added — it would deadlock against the
  # workflow-level lock the run already holds.
  # ==================================================================
  snapshot:
    needs: poll
    # `always()` is load-bearing: without it GitHub treats this job `if` as
    # implicitly `success() && …`, so a CSV-changed run where a LATER,
    # INDEPENDENT poll step failed (e.g. the PDF-health sentinel trips the
    # poll job's `Propagate failure exit code` step) would SKIP this job —
    # losing the credential-free snapshot for exactly the detected change it
    # exists to preserve. We decouple from the poll job's overall result but
    # still gate strictly on the detected-change output. (Codex PR #84 P2.)
    if: always() && needs.poll.outputs.status == 'changed'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit snapshot + diff JSON to main
      issues: write     # append the verdict comment to the tranche-detected issue
    # NOTE: no `env:` with R2_*/CF_* secrets here, by design (see header).
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Check out the tip of main, not the stale cron SHA: the poll
          # job just pushed data/raw/csv/<new_sha>.csv + the sha file, and
          # we need those committed bytes as the generator's input.
          ref: main
          fetch-depth: 1

      # actions/setup-python v6.2.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install minimal scrape deps
        # Same lean, hash-locked install as the poll step (SEC-002) — the
        # generator needs only pydantic + the scrape package, no typer/rich.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-poll.txt

      - name: Generate snapshot + diff
        # Bytes-in, files-out: feeds the committed CSV for the detected
        # sha to the T6.1 generator, which rotates latest.json -> the prior
        # snapshot and writes the new snapshot (both mirrors). No network,
        # no credential — see scripts/poll_snapshot.py.
        #
        # T6.4: --diff-out persists the diff+verdict JSON artifact
        # (classify_tranche verdict + added/removed/new-column counts, keyed
        # by new_sha) so the commit step can ship it and the verdict-comment
        # step can read it back. --summary-out emits the operator-facing
        # markdown the comment step posts onto the existing issue.
        env:
          NEW_SHA: ${{ needs.poll.outputs.new_sha }}
        run: |
          # status=='changed' is emitted by the poll SCRIPT before the later
          # "Commit new sha + CSV bytes" step pushes the bytes. If that push
          # failed (rejected after rebase retries), the CSV isn't on main and
          # the generator would FileNotFoundError. Skip-with-warning instead of
          # a red job — the early tranche-detected alert still stands (Vaivora P2).
          if [ ! -f "data/raw/csv/${NEW_SHA}.csv" ]; then
            echo "::warning::data/raw/csv/${NEW_SHA}.csv not on main (poll CSV commit may have failed despite status=changed); skipping snapshot + verdict."
            exit 0
          fi
          python scripts/poll_snapshot.py \
            --csv "data/raw/csv/${NEW_SHA}.csv" \
            --diff-out "data/manifests/diffs/${NEW_SHA}.json" \
            --summary-out "verdict-summary.md"

      - name: Commit snapshot + diff
        # Commit both the canonical (data/manifests/snapshots) and public
        # (web/public/data/snapshots) mirrors + their refreshed index.json,
        # plus the T6.4 diff+verdict JSON artifact (under
        # data/manifests/diffs/<new_sha>.json — DELIBERATELY a sibling of
        # snapshots/, NOT inside it: the ingest snapshot-locator globs
        # snapshots/<sha>*.json and would otherwise grab the diff artifact and
        # promote it as latest.json). Rebase before push to absorb any
        # concurrent advance of main, the same fast-forward discipline the poll
        # job's commit steps use.
        env:
          NEW_SHA: ${{ needs.poll.outputs.new_sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/snapshots web/public/data/snapshots data/manifests/diffs
          if ! git diff --cached --quiet; then
            git commit -m "chore(poll): snapshot + diff for ${NEW_SHA:0:12}"
            git pull --rebase origin main
            git push
          else
            echo "No snapshot changes to commit."
          fi

      # ==================================================================
      # AUTO vs OPERATOR-ATTENDED — the never-again credential boundary.
      #
      # What CI auto-does (credential-free, this job): detect the tranche →
      # generate snapshot + diff → classify verdict → append the RICH
      # actionable surface (work-list card_ids, card counts, ~$ OCR+embed
      # estimate, and a copy-paste `/ship-tranche <sha>` block) via
      # render_verdict_summary(..., tranche=new_sha). This is the "surface
      # what changed" half of the goal.
      #
      # What STAYS operator-attended (never in CI): the spend + the deploy.
      # The download → OCR (llm-dots/8) → curate clean-qc → embed stages need
      # Anthropic/Voyage spend credentials + the NAS mount + R2 write keys, and
      # the deploy is a live push to main. Those run ONLY on the operator's
      # `/ship-tranche` path (which re-runs preflight_ocr verify-before-spend
      # and `pursue storage verify`). We deliberately do NOT run the scoped
      # ingest stages here and do NOT add any spend/deploy credential to this
      # runner — the snapshot job's credential isolation (see the job header)
      # is load-bearing. CI scopes + surfaces; the operator spends + ships.
      # ==================================================================
      - name: Append verdict to tranche-detected issue
        # T6.4: surface the classify_tranche verdict to the operator. The
        # early tranche-detected alert (opened in the poll job) intentionally
        # lacks the diff — the diff only exists after THIS job runs the
        # generator. So we APPEND the verdict here, never recreate the issue
        # (a `gh issue create` would duplicate the alert and collapse the
        # credential-isolation job split). Locate the existing open issue by
        # the new_sha embedded in its title, then comment the rendered
        # markdown summary. `continue-on-error` so a transient gh hiccup
        # can't lose the just-committed snapshot.
        if: needs.poll.outputs.is_bootstrap == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ needs.poll.outputs.new_sha }}
        run: |
          short_sha="${NEW_SHA:0:12}"
          # Locate via the REST list (--json) + client-side title filter, NOT
          # gh's query-based search: that hits the search API, which lags issue
          # creation by seconds-to-minutes, and the poll job opened this issue
          # moments ago. The REST list is immediately consistent.
          # Pass short_sha as DATA to jq (--arg), never interpolated into the jq
          # program text: it's hex today, but --arg hardens against any future
          # non-hash provenance (jq injection). --limit 100 so a backlog of open
          # tranche-detected issues can't push the just-created one out of view.
          issue=$(gh issue list \
            --label tranche-detected --state open --limit 100 \
            --json number,title 2>/dev/null \
            | jq -r --arg s "$short_sha" \
                'map(select(.title | contains($s))) | .[0].number // empty' \
            2>/dev/null || echo "")
          if [ -z "$issue" ]; then
            echo "No open tranche-detected issue for $short_sha; skipping verdict comment."
            exit 0
          fi
          gh issue comment "$issue" --body-file verdict-summary.md
