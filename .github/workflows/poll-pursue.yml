name: Poll PURSUE for new tranches

# Runs the lightweight poll on a 6-hour cadence. The script fetches the
# upstream CSV via curl_cffi (Chrome-TLS impersonation), hashes it, and
# compares to the committed last-known-sha. On change, it commits the new
# sha and opens a `tranche-detected` issue. On fetch failure (Akamai 4xx,
# transport error, empty body) it opens a `tranche-poll-failure` issue and
# the job fails so the operator gets a workflow-failure email too.
#
# Why this layer: detection lives on infra DOW doesn't control. If the
# poll starts failing, that's an early warning to investigate. If it
# silently stops detecting, the next operator-attended run will catch up
# but we'll have lost the canonical-archive lead.
#
# A second observability lane — the PDF-fetch health check — runs
# after the CSV poll and uses the same curl_cffi Chrome-impersonate
# path. If Akamai ever tightens PDF gating without touching the CSV
# (or vice versa), one lane will fail while the other stays green
# and we'll know within 6 hours instead of finding out from a failed
# operator-attended download stage. Both lanes feed the same
# `gh issue create` pipeline so the alert pathway stays unified.
#
# Operational dependencies (SEC-004):
# * Direct push: the "Commit new sha" step pushes straight to `main`
#   using the auto-provisioned `GITHUB_TOKEN`. If branch protection is
#   later enabled on `main` requiring PRs/reviews, this push will fail
#   and the sha update will be lost. Either keep `github-actions[bot]`
#   exempt from those rules, or rework this step to open a PR.
# * Bot commit surface: the bot ONLY ever writes
#   `data/last-known-csv-sha.txt`. Future contributors should not
#   expand the commit surface without revisiting permissions.
# * Action pinning: `actions/checkout` and `actions/setup-python` are
#   pinned to commit SHAs (SEC-001). Bumps land via Dependabot
#   (`.github/dependabot.yml`, `github-actions` ecosystem).
# * Pip install is hash-locked via `requirements-poll.txt` (SEC-002).
#   Regenerate with:
#     pip-compile --generate-hashes -o requirements-poll.txt \
#       requirements-poll.in

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours UTC
  workflow_dispatch:

permissions:
  contents: write   # commit data/last-known-csv-sha.txt on change
  issues: write     # open tranche-detected / tranche-poll-failure issues

concurrency:
  group: poll-pursue
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Shallow checkout is fine — we make a single fast-forward
          # commit and rebase before push if main advanced concurrently.
          fetch-depth: 1

      # actions/setup-python v6.2.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Ensure issue labels exist
        # `gh issue create --label foo` exits non-zero when `foo` doesn't
        # exist on the repo, which would mask the structured payload the
        # poll script emits. `gh label create --force` is idempotent, so
        # this is safe to run on every invocation.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tranche-detected \
            --color 0E8A16 \
            --description "Upstream PURSUE CSV changed; operator should run heavy ingest" \
            --force
          gh label create tranche-poll-failure \
            --color D93F0B \
            --description "The auto-poll workflow could not fetch/parse the upstream CSV" \
            --force
          gh label create pdf-health-failure \
            --color D93F0B \
            --description "The 6h cron sentinel PDF fetch failed (likely Akamai gating shift)" \
            --force

      - name: Install minimal scrape deps
        # Hash-locked install (SEC-002). Source list:
        # `requirements-poll.in`; resolved + hashed:
        # `requirements-poll.txt`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-poll.txt

      - name: Run poll
        id: poll
        run: python scripts/poll_pursue.py
        # Don't `set -e` out here — script exits 1 on fetch failure and we
        # still want the issue-opening step to fire before failing the job.
        continue-on-error: true

      - name: Commit new sha (when changed)
        if: steps.poll.outputs.status == 'changed'
        env:
          OLD_SHA: ${{ steps.poll.outputs.old_sha }}
          NEW_SHA: ${{ steps.poll.outputs.new_sha }}
          IS_BOOTSTRAP: ${{ steps.poll.outputs.is_bootstrap }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-known-csv-sha.txt
          if [ "$IS_BOOTSTRAP" = "true" ]; then
            MSG="chore(poll): bootstrap last-known sha ${NEW_SHA:0:12}"
          else
            MSG="chore(poll): upstream CSV changed ${OLD_SHA:0:12} -> ${NEW_SHA:0:12}"
          fi
          git commit -m "$MSG"
          # Rebase against any concurrent advance of main (e.g. a human
          # merge between checkout and push). Without this, fetch-depth: 1
          # plus a bare push races on non-fast-forward. (vaivora P1#2)
          git pull --rebase origin main
          git push

      - name: Open tranche-detected issue
        # Skip the issue on bootstrap — there's no actual change to alert on,
        # we just hadn't been watching yet.
        if: steps.poll.outputs.status == 'changed' && steps.poll.outputs.is_bootstrap == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.poll.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.poll.outputs.issue_body }}
          ISSUE_LABELS: ${{ steps.poll.outputs.issue_labels }}
        run: |
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body  "$ISSUE_BODY" \
            --label "$ISSUE_LABELS"

      - name: Open tranche-poll-failure issue
        # Fire on either the script-emitted status OR a hard step failure
        # (e.g. import/runtime error before $GITHUB_OUTPUT is written).
        # Without the outcome check, a crash that bypasses the output
        # file would silently disable failure alerting. (Codex P1)
        if: steps.poll.outputs.status == 'failed' || steps.poll.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fall back to a generic title/body when the script crashed
          # before emitting outputs.
          ISSUE_TITLE: ${{ steps.poll.outputs.issue_title || 'PURSUE poll crashed (no structured output)' }}
          ISSUE_BODY: ${{ steps.poll.outputs.issue_body || 'The poll script exited with a non-zero status before writing $GITHUB_OUTPUT. See the workflow run log for details.' }}
          ISSUE_LABELS: ${{ steps.poll.outputs.issue_labels || 'tranche-poll-failure' }}
        run: |
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body  "$ISSUE_BODY" \
            --label "$ISSUE_LABELS"

      - name: Run PDF-fetch health check
        # Sentinel-PDF ping via the same curl_cffi Chrome-impersonate
        # path the CSV fetcher uses. Catches PDF-only Akamai gating
        # shifts that the CSV poll would miss. `continue-on-error` so
        # the issue-opening step can still fire on failure.
        #
        # Like scripts/poll_pursue.py, this script sys.path-injects
        # `src/` itself so it works under the lean
        # `requirements-poll.txt` install (no full `pursue` CLI dep).
        id: pdf_health
        run: python scripts/pdf_health_check.py
        continue-on-error: true

      - name: Open pdf-health-failure issue
        # Fires whenever the sentinel fetch fails. The body links the
        # operator straight to the workflow log; the curl_cffi shared
        # path means the CSV fetcher is also worth a re-check (a
        # gate that broke PDFs may break CSVs next).
        if: steps.pdf_health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(cat <<EOF
          The 6h cron's sentinel PDF fetch failed.

          This is the canary for PDF-side Akamai gating: the same
          curl_cffi Chrome-impersonate path that the CSV fetcher uses.
          If this is failing but the CSV poll passed, Akamai likely
          tightened gating on the medialink/PDF download path
          specifically. If both are failing, the shared TLS/header
          contract is the suspect.

          Run log: $RUN_URL

          Triage:
          1. Pull the workflow log; the failing step prints
             pdf-health.fail url=<url> status=<n> error=<msg> on stderr.
          2. Re-run 'pursue scrape fetch-raw' locally — if that also
             4xxs, the gate moved on the shared path.
          3. If only PDFs are 4xx, compare the Range/Referer headers
             in src/pursue_index/scrape/pdf_health.py against the
             download stage and bring them into agreement.
          EOF
          )
          gh issue create \
            --title "[health] PDF fetch failed (sentinel ping)" \
            --label "pdf-health-failure" \
            --body "$BODY"

      - name: Propagate failure exit code
        # Workflow goes red on EITHER failure mode (CSV poll OR PDF health).
        # Without this, a green checkmark could ship while one of the two
        # surveillance lanes was actively broken.
        if: steps.poll.outputs.status == 'failed' || steps.poll.outcome == 'failure' || steps.pdf_health.outcome == 'failure'
        run: exit 1
