name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/manifests/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Python toolchain for the OG image regen step below. The
      # generator is byte-stable, so re-rendering on every deploy
      # produces an identical PNG when the manifest hasn't changed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for OG image build
        working-directory: ${{ github.workspace }}
        # Match the lower bound in pyproject.toml (CVE-2024-28219).
        run: pip install "pillow>=11.1.0"

      - name: Regenerate OG image from current manifest
        working-directory: ${{ github.workspace }}
        # Reads data/manifests/latest.json and writes web/public/og.png.
        # Idempotent — safe to run on every deploy.
        run: python scripts/build_og_image.py

      - name: Sync manifest into web/src/data
        run: cp ../data/manifests/latest.json src/data/manifest.json

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
