name: Daily byte-verify of every referenced asset

# Catches the threat model the operator named (2026-05-11):
#   "Decent attempt to defeat scrapers by keeping the same file name
#    but serving other content. Non-zero chance someone will just
#    replace it and not even notice."
#
# The 30-minute poll workflow drives an asset archive ONLY when the
# upstream CSV sha changes — efficient, but blind to silent same-URL-
# different-bytes overlays. This workflow closes that hole: once a
# day it runs the same r2_archive_assets.py script against the
# current manifest. The script's HEAD-then-GET path short-circuits
# unchanged assets cheaply (one HEAD per card, ~50ms each), and only
# fetches + archives the few (typically zero) whose content-length
# differs from their last registry entry. So a full daily verify
# costs ~130 lightweight HEAD requests against war.gov and zero R2
# writes when nothing changed — the day a silent overlay lands, the
# script catches it, archives the new byte_sha at archive/<sha>.<ext>
# (never touching the prior archive entry), and appends a registry
# row. Diff queryable on next inspection.
#
# Idempotency contract: byte_sha == filename means a re-archived
# unchanged byte stream costs zero R2 storage. Registry only appends
# when the byte_sha was not previously recorded for that card_id.
#
# Same credentials required as the poll workflow's asset-archive
# lane — see comments in poll-pursue.yml for the operator setup.
# If credentials are missing this workflow exits 0 with a one-line
# log message; it doesn't fail.
#
# Cadence: 06:00 UTC daily. Spread out from the 30-min CSV poll
# cron times so the two lanes don't pile up on the same minute.

on:
  schedule:
    # 06:07 UTC — offset from any 30-minute boundary so this never
    # fires concurrently with the poll workflow's `*/30 * * * *` cron.
    # The 7-minute offset isn't strictly necessary now that both
    # workflows share the same concurrency group, but it's a free
    # belt-and-suspenders defense against the registry-write race
    # nayru P1 flagged.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with poll-pursue.yml so the two registry-writing workflows
  # serialize on the same lock (nayru P1). Without this, a 06:07 UTC
  # verify tick could run simultaneously with a 06:00 UTC poll tick,
  # both append to data/asset-bytes-registry.jsonl, and both
  # git pull --rebase + push — a deterministic recipe for losing one
  # workflow's appended rows during the rebase resolution.
  group: pursue-registry-writers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          # Sprint 4e Phase 4: tag-verify step below needs the signed
          # ``registry-root-*`` tags. Default checkout doesn't fetch
          # tags; enable it.
          fetch-tags: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install verify deps
        # Same lean set as the poll workflow's asset-archive lane —
        # curl_cffi via requirements-poll.txt, boto3 + transitive deps
        # via requirements-archive.txt. Both files hash-pinned (closes
        # the SEC-001 supply-chain finding from laverna review). This
        # lane runs with R2 credentials in its env so an unpinned
        # transitive of boto3 was a clear arbitrary-code path to
        # bucket-write access.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-poll.txt
          python -m pip install --require-hashes -r requirements-archive.txt

      - name: Run R2 byte-verify
        id: verify
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/r2_archive_assets.py
        continue-on-error: true

      - name: Verify /removed + VID preservation copies
        # The manifest-walking verify above only covers PDF/IMG cards
        # currently in latest.json (asset_url + war.gov-served). Two
        # classes of registry row live outside that walk but still
        # need integrity coverage:
        #
        #   * /removed cards (upstream-pulled or replaced) — preserved
        #     bytes live in R2 alone; the upstream URL is no longer
        #     authoritative.
        #   * VID cards — Sprint 4b Theme C. Video registry rows carry
        #     archive_key but no current_key (the worker serves video
        #     via DVIDS iframe, not from R2). r2_verify_preserved.py
        #     was extended to walk no-current_key rows as implicit
        #     preservation rows so the daily sweep no longer silently
        #     skips the 28 VID archive copies.
        #
        # Re-reads each eligible row's archive_key bytes from R2, hashes,
        # compares against the pinned byte_sha in the registry. Exits
        # non-zero if any card fails; the next step files a (different)
        # issue and never blocks the silent-overlay path above.
        id: verify_preserved
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/r2_verify_preserved.py \
            --report /tmp/preserved-verify-report.json
        continue-on-error: true

      - name: Commit registry updates (when verify ran)
        # Sprint 4e: refresh data/registry-root.txt +
        # data/registry-root-manifest.txt in lockstep so the
        # registry-root-on-promote workflow stays green on bot-driven
        # appends (vaivora H1 / nayru H1.2). The signing-stale issue
        # lane below pings the operator to sign a fresh tag covering
        # the new root.
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/asset-bytes-registry.jsonl ]; then
            python scripts/registry_root.py
            git add data/asset-bytes-registry.jsonl \
                    data/registry-root.txt \
                    data/registry-root-manifest.txt
          fi
          if ! git diff --cached --quiet; then
            new_rows=$(git diff --cached -- data/asset-bytes-registry.jsonl | grep -c '^+{')
            git commit -m "chore(verify): daily byte-verify caught +${new_rows} row(s)"
            git pull --rebase origin main
            git push
          else
            echo "No byte changes detected today."
          fi

      - name: Open issue when silent overlay caught
        # If the daily verify added new registry rows, that means an
        # asset's bytes changed without the CSV changing — exactly the
        # threat we're watching for. Open an issue so the operator
        # sees it on first sign-in. Dedup guard avoids spamming.
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only open issue when the last commit was the verify's.
          if ! git log -1 --pretty=%s | grep -q "byte-verify caught"; then
            echo "No silent overlay detected on this run."
            exit 0
          fi
          gh label create silent-overlay-detected \
            --color "B60205" \
            --description "Daily byte-verify caught upstream bytes changing under a stable URL" \
            --force 2>/dev/null || true
          # Dedup: skip if there's already an open issue with this label.
          existing=$(gh issue list --label silent-overlay-detected --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already tracking; skipping."
            exit 0
          fi
          # Enumerate the exact rows this run added, not just the tail
          # of the file — concurrent registry writers can interleave
          # appends and a tail-slice may not contain the newly-added
          # rows. `git diff HEAD^ HEAD` reads from the just-committed
          # diff, which is the precise set this run produced.
          added=$(git diff HEAD^ HEAD -- data/asset-bytes-registry.jsonl 2>/dev/null | grep -c '^+{' || echo "?")
          gh issue create \
            --title "[integrity] Silent same-URL-different-bytes overlay detected" \
            --label "silent-overlay-detected" \
            --body "The daily verify workflow caught upstream bytes changing under a stable URL. ${added} new row(s) landed in data/asset-bytes-registry.jsonl this run. Run log: $RUN_URL"

      - name: Open issue when preserved tampering detected
        # Different threat from silent-overlay-detected: a preserved
        # card's bytes in R2 no longer hash to the pinned byte_sha. The
        # IfNoneMatch guard prevents archive/<sha>.<ext> from being
        # overwritten, but the current-pointer <card_id>.<ext> key is
        # writable — a leaked write key, a buggy script run, or an
        # accidental wrangler PUT could tamper with one without
        # touching upstream. This issue alerts the operator with the
        # exact diff so they can roll the current-pointer back from
        # archive/<sha>.<ext>.
        if: steps.verify_preserved.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create preserved-tampered \
            --color "B60205" \
            --description "Daily byte-verify caught a /removed preservation copy mismatching its pinned byte_sha" \
            --force 2>/dev/null || true
          existing=$(gh issue list --label preserved-tampered --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already tracking; skipping."
            exit 0
          fi
          if [ -f /tmp/preserved-verify-report.json ]; then
            body_file=/tmp/preserved-verify-report.json
            report_excerpt=$(cat "$body_file" | head -c 3000)
          else
            report_excerpt="(report file not produced; check run log)"
          fi
          gh issue create \
            --title "[integrity] Preserved card tampering detected" \
            --label "preserved-tampered" \
            --body "$(printf 'A /removed preservation copy in R2 no longer matches its pinned byte_sha. This is tampering inside our control plane (not upstream). Roll the current-pointer back from archive/<sha>.<ext>.\n\nReport excerpt:\n```\n%s\n```\n\nRun log: %s' "$report_excerpt" "$RUN_URL")"

      - name: Verify latest signed registry-root tag
        # Sprint 4e Phase 4 + 2nd fix-pass. Tier-2 signature gate:
        # every promote bumps data/registry-root.txt and the operator
        # signs a ``registry-root-YYYY-MM-DD-HHMM`` git tag whose tree
        # transitively commits to that root. The daily verify checks
        # three things, in order:
        #
        #   1. ``signing_state == verified`` — the latest tag's
        #      signature verifies against the **pinned operator
        #      signing key** sourced from the
        #      ``OPERATOR_ALLOWED_SIGNERS`` GitHub Actions secret.
        #   2. ``signing_state == stale`` (Codex P1 #1) — the latest
        #      signed tag's ``data/registry-root.txt`` content matches
        #      the current HEAD's root file. Otherwise the current
        #      state has shifted and is no longer covered by any
        #      signed attestation.
        #   3. ``signing_state == unconfigured`` — the secret isn't
        #      set yet; tier-2 verification is dormant.
        #
        # Trust anchor (Codex P1 #2 + #3): we pin verification to
        # exactly the operator's signing key, sourced from a GitHub
        # Actions secret. Three previous designs were rejected:
        #
        # * ``docs/allowed-signers.txt`` in-repo — anyone with
        #   repo:write can swap in their own key (Codex P1 #2).
        # * ``gh api .verification.verified`` — "valid against ANY
        #   GitHub-registered signing key", which a repo:write
        #   attacker with their own registered Signing key can satisfy
        #   (Codex P1 #3).
        # * ``allowed-signers.txt`` populated from
        #   ``https://github.com/<owner>.keys`` — same failure mode
        #   as above if the attacker is a collaborator.
        #
        # The secret lives in repo Settings → Secrets and variables →
        # Actions and is only modifiable by users with admin/maintain
        # role on the repo (i.e., not repo:write contributors).
        #
        # The repo-tracked allowed-signers file remains as
        # reader-convenience documentation only (see
        # ``docs/allowed-signers.txt`` + ``docs/runbooks/
        # registry-root-signing.md``).
        #
        # Bootstrap window: before the operator signs the baseline
        # tag AND sets the secret, this step exits 0 with a
        # ``::notice::``. The on-promote workflow's root-file
        # freshness check is sufficient until both land.
        #
        # ``continue-on-error: true`` keeps the silent-overlay lane
        # above this one from being suppressed during a key rotation.
        id: signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ssh-ed25519 allowed_signers line(s) for the operator key
          # that ought to be signing the registry-root-* tags. Format:
          #   <email> ssh-ed25519 <base64-key>
          # Set in repo Settings → Secrets and variables → Actions.
          OPERATOR_ALLOWED_SIGNERS: ${{ secrets.OPERATOR_ALLOWED_SIGNERS }}
        run: |
          latest_tag=$(git tag --list 'registry-root-*' --sort=-creatordate | head -1)
          if [ -z "$latest_tag" ]; then
            echo "::notice::no signed registry-root tag yet — operator must sign the baseline tag to enable tier-2 verification"
            echo "signing_state=bootstrap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$OPERATOR_ALLOWED_SIGNERS" ]; then
            echo "::warning::OPERATOR_ALLOWED_SIGNERS secret is not set — tier-2 signature verification is dormant. Set the secret in repo Settings → Secrets and variables → Actions to activate."
            echo "signing_state=unconfigured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest tag: $latest_tag"

          # Materialize the pinned allowed-signers from the secret to
          # a runner-local tmp file. Chmod 600 is hygiene — the runner
          # is single-tenant so leakage scope is the job step itself.
          umask 077
          printf '%s\n' "$OPERATOR_ALLOWED_SIGNERS" > "$RUNNER_TEMP/trusted-signers.txt"
          chmod 600 "$RUNNER_TEMP/trusted-signers.txt"

          # ``git tag -v`` returns 0 iff the tag is signed AND the
          # signature validates against a principal in the
          # allowed-signers file. Critically, ONLY the operator key
          # in the secret is trusted — not all GitHub-registered
          # signing keys (the Codex P1 #3 hole).
          if git -c gpg.format=ssh \
                 -c "gpg.ssh.allowedSignersFile=$RUNNER_TEMP/trusted-signers.txt" \
                 tag -v "$latest_tag" 2>"$RUNNER_TEMP/tag-verify.log"; then
            echo "Signature verified against pinned operator key."
          else
            echo "::error::signature verification FAILED on $latest_tag against pinned operator key"
            tail -c 2000 "$RUNNER_TEMP/tag-verify.log" || true
            echo "signing_state=failed" >> "$GITHUB_OUTPUT"
            echo "failed_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Freshness binding (Codex P1 #1): the signed tag's tree
          # must include a registry-root.txt that matches the
          # current HEAD's registry-root.txt. Otherwise current
          # state is unsigned — even though a valid tag exists.
          signed_root=$(git show "$latest_tag:data/registry-root.txt" 2>/dev/null | tr -d '[:space:]')
          current_root=$(tr -d '[:space:]' < data/registry-root.txt)
          if [ -z "$signed_root" ] || [ "$signed_root" != "$current_root" ]; then
            echo "::error::current registry-root NOT covered by latest signed tag"
            echo "  current = $current_root"
            echo "  signed  = $signed_root (from $latest_tag)"
            echo "signing_state=stale" >> "$GITHUB_OUTPUT"
            echo "failed_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::signature verified on $latest_tag (covers current root $current_root)"
          echo "signing_state=verified" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open issue when signing verification fails
        # Distinct from preserved-tampered / silent-overlay: this
        # signals that the chain-of-trust ON THE REGISTRY ITSELF is
        # broken, not that R2 bytes diverged. Operator response is
        # to check the OPERATOR_ALLOWED_SIGNERS secret (the trust
        # anchor) for key rotation in progress, then assume tier-2
        # tampering if no rotation is expected.
        if: steps.signing.outputs.signing_state == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_TAG: ${{ steps.signing.outputs.failed_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create signing-failure \
            --color "B60205" \
            --description "git tag -v failed against the pinned operator key on the latest registry-root-* tag" \
            --force 2>/dev/null || true
          existing=$(gh issue list --label signing-failure --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already tracking; skipping."
            exit 0
          fi
          # Surface the tail of the verify log (which captured the
          # ssh-keygen reason for rejection) without leaking the
          # secret allowed-signers file path beyond the runner tmp
          # dir (RUNNER_TEMP is per-job ephemeral).
          if [ -f "$RUNNER_TEMP/tag-verify.log" ]; then
            log_excerpt=$(tail -c 2000 "$RUNNER_TEMP/tag-verify.log")
          else
            log_excerpt="(verify log not captured)"
          fi
          gh issue create \
            --title "[integrity] Signing verification failed on $FAILED_TAG" \
            --label "signing-failure" \
            --body "$(printf 'git tag -v failed on %s against the pinned operator key (from the OPERATOR_ALLOWED_SIGNERS secret). Either (a) a key rotation is in progress (update the secret with the new key, then re-sign the latest tag), or (b) tier-2 tampering. Check pursue-opsec-staging/findings/2026-05-18-tier2-registry-signing-rfc.md §5.2 for the rotation playbook.\n\nVerify log:\n```\n%s\n```\n\nRun log: %s' "$FAILED_TAG" "$log_excerpt" "$RUN_URL")"

      - name: Open issue when latest signed tag is stale (does not cover HEAD)
        # Codex P1 #1: the latest tag's signature verifies, but the
        # tag's tree contains an OLDER ``registry-root.txt`` than HEAD
        # has. Means a bot writer (silent-overlay catch, scheduled
        # poll) — or a manual commit — bumped the registry and the
        # root since the last tag, and the operator hasn't signed a
        # fresh tag yet. The current registry state is therefore
        # unsigned even though tier-1 + the on-promote workflow are
        # both green.
        #
        # Operator response: sign a fresh registry-root tag against
        # HEAD. The next daily cron auto-resolves the issue (matching
        # signed root → no issue creation; existing one stays open
        # until the operator closes it OR a fresh promote happens).
        if: steps.signing.outputs.signing_state == 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_TAG: ${{ steps.signing.outputs.failed_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create signing-stale \
            --color "FBCA04" \
            --description "Current registry-root.txt is not covered by the latest signed registry-root-* tag" \
            --force 2>/dev/null || true
          existing=$(gh issue list --label signing-stale --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already tracking; skipping."
            exit 0
          fi
          current_root=$(tr -d '[:space:]' < data/registry-root.txt)
          gh issue create \
            --title "[integrity] Current registry-root not covered by signed tag" \
            --label "signing-stale" \
            --body "$(printf 'The latest signed tag %s verifies, but the registry-root it covers does not match the current HEAD root file.\n\nCurrent root (unsigned): %s\n\nThis is the expected state after the daily silent-overlay catch (or 30-min poll) appends a new registry row — the bot writers refresh `data/registry-root.txt` in lockstep, but only the operator can sign a fresh `registry-root-*` tag. Re-sign per the per-promote workflow in `docs/runbooks/registry-root-signing.md`.\n\nRun log: %s' "$STALE_TAG" "$current_root" "$RUN_URL")"
