name: Smoke test /api/* dispatch

# Integration boundary test for the Worker dispatch contract.
#
# Why this exists:
#   PR #4 shipped the static /api docs page; PR #16 had to fix a regression
#   where the Worker's prefix-match shadowed it. Three reviewers missed the
#   collision because the unit tests in worker/tests/api_gate.test.js stub
#   the ASSETS binding and the web tests don't exercise the Worker. This
#   workflow runs `wrangler dev` against a freshly-built web/dist and
#   asserts the dispatch contract end-to-end (assertions in
#   scripts/smoke_api_dispatch.sh).
#
# Triggering posture:
#   * pull_request -> main, ONLY when files that can break the contract
#     change. Every-push on main would generate noise; the contract is a
#     pre-merge gate. The path filter includes web/astro.config.mjs and
#     web/package*.json because those control what builds web/dist/api/
#     index.html (the smoke's own input).
#   * workflow_dispatch for operator-driven re-runs.
#
# Permissions: contents: read only — this job never writes to the repo.
#
# Action pinning: SHA-pinned per SEC-001, same posture as poll-pursue.yml.
# Bumps land via Dependabot's `github-actions` ecosystem.

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "web/src/pages/api.astro"
      - "web/src/pages/api/**"
      - "web/astro.config.mjs"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/smoke_api_dispatch.sh"
      - ".github/workflows/smoke-api-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

# Per-PR cancel-in-progress: stale runs from successive pushes pile up
# otherwise. workflow_dispatch runs are isolated by run_id.
concurrency:
  group: smoke-api-dispatch-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      # actions/setup-node v6.4.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        # Installs the lockfile-pinned wrangler devDep that the smoke
        # script invokes from web/node_modules/.bin/. Without this step
        # the script would have to fetch wrangler at runtime, which
        # leaks supply-chain control to npm's "current" tag.
        run: npm ci

      - name: Build web/dist
        working-directory: web
        # The smoke script's preflight refuses to start wrangler dev
        # without web/dist/api/index.html present.
        run: npm run build

      - name: Run /api dispatch smoke
        id: smoke
        # SMOKE_KEEP_LOG=1 tells the script's cleanup trap to skip
        # `rm -f` on the wrangler dev log, so the upload-artifact step
        # below can pick it up. The script also copies the log to
        # $GITHUB_WORKSPACE/wrangler-smoke.log on non-zero exit, which
        # is what the artifact step actually uploads.
        env:
          SMOKE_KEEP_LOG: "1"
        run: bash scripts/smoke_api_dispatch.sh

      - name: Upload wrangler dev log on failure
        if: failure()
        # actions/upload-artifact v4.6.2 — pinned to SHA per SEC-001.
        # The smoke script copies its log to
        # $GITHUB_WORKSPACE/wrangler-smoke.log on non-zero exit; pick
        # that up here so post-mortem on a CI failure is the full log,
        # not just the in-band tail-80 dump.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wrangler-smoke-log
          path: wrangler-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Capture wrangler dev log on failure
        if: failure()
        # Surface a diagnostic hint into the run summary alongside the
        # uploaded artifact above. The smoke script also dumps its
        # tail-80 to stderr in the smoke step, which is the immediate
        # signal; the artifact is the post-mortem signal.
        run: |
          {
            echo "## /api dispatch smoke failed"
            echo ""
            echo "The integration smoke test for the /api/* dispatch contract failed."
            echo "Inspect the 'Run /api dispatch smoke' step output above for the failing"
            echo "assertion(s), and the 'wrangler-smoke-log' artifact for the full"
            echo "wrangler dev log. The contract is documented in"
            echo "\`scripts/smoke_api_dispatch.sh\` and \`docs/architecture.md\`."
            echo ""
            echo "Common causes:"
            echo "* New WORKER_API_PATHS entry without a smoke assertion"
            echo "* New static /api/*.astro page without a smoke assertion"
            echo "* Worker dispatcher regressed to prefix-match (PR #16 redux)"
          } >> "$GITHUB_STEP_SUMMARY"
