name: IndexNow ping after tranche change

# Sprint 4b Theme B. Companion to wayback-after-deploy.yml.
# Submits the live pursueindex.com sitemap URLs to IndexNow
# (https://api.indexnow.org/indexnow) so Bing/Yandex (and ChatGPT-
# search via Bing) discover changes within minutes of deploy instead
# of waiting for their normal sitemap-crawl cadence (days).
#
# Triggers: identical narrowed path filter to wayback-after-deploy.yml
# (L3 fix-pass) so state.md sweeps + docs/ + OG-render-bot commits
# don't fire fresh pings. The 5-min sleep matches Wayback's: timed
# against the CF Workers Builds dashboard pipeline which auto-deploys
# on push to main.
#
# OPERATOR ACTION REQUIRED before this workflow does anything useful:
#
#   1. Generate a random 32-char hex string. Call it INDEXNOW_KEY.
#        $ python3 -c "import secrets; print(secrets.token_hex(16))"
#
#   2. Commit a public verification file in this repo at
#      ``web/public/<INDEXNOW_KEY>.txt`` containing ONLY that key on
#      one line (no newline strictly required but Astro copies through
#      whatever bytes the file holds). After the next deploy this
#      becomes ``https://pursueindex.com/<INDEXNOW_KEY>.txt`` — the
#      ownership proof IndexNow re-checks for ~7 days after first
#      submission.
#
#   3. Add the same value as a GitHub Actions secret named
#      ``INDEXNOW_KEY`` under Settings → Secrets and variables →
#      Actions. The workflow reads it as ``secrets.INDEXNOW_KEY``
#      and the script picks it up via the ``INDEXNOW_KEY`` env var.
#
#   4. (optional) The placeholder file ``web/public/indexnow-placeholder.txt``
#      shipped with this workflow is a literal warning that no real key
#      is configured yet. Replace with the real ``<INDEXNOW_KEY>.txt``
#      and delete the placeholder.
#
# Until step 1-3 are done, this workflow runs and exits 0 with a
# single-line "no key found" log message — never fails the build.
# That's deliberate: the workflow file lands before the operator has
# the key, and we don't want red checkmarks on every main push during
# the rollout window.
#
# IndexNow rate limits aren't published; in practice we send ≤200
# URLs per deploy (158 cards + finds + a handful of static pages),
# well under the 10 000-URL per-batch cap.

on:
  push:
    branches: [main]
    paths:
      # Identical narrowed filter to wayback-after-deploy.yml. State-
      # only sweeps, docs/, and OG-render-bot commits should not
      # trigger fresh IndexNow pings.
      - 'data/manifests/latest.json'
      - 'web/src/pages/**'
      - 'web/src/content/**'
      - 'web/src/components/**'
      - 'web/src/layouts/**'
  workflow_dispatch:

permissions:
  contents: read   # Read-only — this workflow doesn't commit anything.

concurrency:
  group: indexnow-after-deploy
  cancel-in-progress: false

jobs:
  indexnow-ping:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      # actions/setup-python v6.2.0 — pinned to SHA per SEC-001.
      # Matches the SHA used by wayback-after-deploy.yml.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Wait for CF Workers Builds deploy + edge warm (5 min)
        # Same dependency as wayback-after-deploy. IndexNow re-fetches
        # ``https://{host}/{key}.txt`` to verify ownership; if we ping
        # before the CFWB deploy completes, IndexNow may receive a 404
        # on the key file and reject the submission. 5 min covers the
        # typical 2-3 min CFWB latency plus edge warm.
        if: github.event_name == 'push'
        run: sleep 300

      - name: Submit live sitemap URLs to IndexNow
        # The script:
        #   * reads the live sitemap-index from pursueindex.com (post-
        #     deploy), follows each child once, and concatenates page
        #     URLs (same pattern as wayback_save)
        #   * splits into ≤10 000-URL batches and POSTs each
        #   * surfaces 4xx/5xx as ``::warning::`` annotations but
        #     always exits 0 so a transient throttle doesn't go red
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python scripts/indexnow_ping.py \
            --sitemap https://pursueindex.com/sitemap-index.xml \
            --host pursueindex.com
