name: Deploy to Cloudflare Workers (fallback)

# Fallback CI for `npx wrangler deploy`. The primary deploy path is the
# Cloudflare Workers Builds pipeline configured in the CF dashboard
# (see wrangler.jsonc header). That pipeline has stalled multiple times
# (2026-05-09: PRs #6-#17 merged but the live worker stayed pinned to a
# pre-#6 build until the operator manually ran `npx wrangler deploy`),
# so this workflow exists as a redundant deploy path that we control.
#
# When this fires *and* CF Workers Builds is healthy, both will deploy
# the same commit — wrangler is idempotent on identical bundles, the
# second deploy just produces a new version pointing at the same code.
#
# Required repo secrets (operator must set in repo settings):
#   CLOUDFLARE_API_TOKEN  — same value as PURSUE_CF_API_TOKEN in .env
#   CLOUDFLARE_ACCOUNT_ID — same value as PURSUE_CF_ACCOUNT_ID in .env
#
# Operational dependencies (mirrors poll-pursue.yml SEC-001/002):
# * Action pinning: `actions/checkout` and `actions/setup-node` are
#   pinned to commit SHAs. Bumps land via Dependabot
#   (`.github/dependabot.yml`, `github-actions` ecosystem).
# * No pip installs here — pure Node + wrangler.
# * Failure-issue pattern mirrors poll-pursue.yml: on deploy failure,
#   open or update a `deploy-failure` issue with the run URL so the
#   operator gets paged via GitHub notifications. The full wrangler
#   output is not embedded in the issue body (see laverna MED-001
#   audit on PR #18) — the run URL is repo-read-gated and is the
#   authoritative log surface.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - "worker/package.json"
      - "worker/package-lock.json"
      - "wrangler.jsonc"
      # Narrowed from `data/**` to `data/manifests/**`: poll-pursue.yml
      # writes `data/last-known-csv-sha.txt` on a 6-hour cron and pushes
      # to main from `github-actions[bot]`; matching `data/**` would
      # trigger a full deploy for a one-line SHA bump that does not
      # affect the bundle. Only `data/manifests/**` ships into the
      # build (via the `cp` step below).
      - "data/manifests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf.yml"
      # OG build scripts run in this workflow; a change to either
      # script or its rendering modules must re-deploy so the new
      # PNGs ship to production.
      - "scripts/build_og_image.py"
      - "scripts/build_finds_og_images.py"
      - "src/pursue_index/web/og_image.py"
      - "src/pursue_index/web/og_layers.py"
      - "src/pursue_index/web/og_fonts.py"
      - "src/pursue_index/web/finds_og.py"
      - "src/pursue_index/web/finds_frontmatter.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize deploys: only one in flight at a time, and cancel any
  # stale queued/running deploys when a newer commit lands. This avoids
  # racing two `wrangler deploy` calls and avoids deploying an
  # already-superseded commit.
  group: deploy-cf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # for the failure-issue step below
    steps:
      # actions/checkout v4.2.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      # actions/setup-node v4.4.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Node 22 LTS — matches `web/package.json` engines field
          # (`"node": ">=22.12.0"`) and the Node version `web/package-lock.json`
          # was generated under. The deleted `deploy-ui.yml` correctly
          # used 22 here. Wrangler supports >=20 and Astro 6 supports
          # >=20.10, but the project's manifest is the authority.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Ensure deploy-failure label exists
        # Idempotent — `gh label create --force` is upsert.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create deploy-failure \
            --color B60205 \
            --description "GH Actions wrangler-deploy fallback failed; live worker may be stale" \
            --force

      - name: Install web deps (npm ci, exact lockfile)
        working-directory: web
        run: npm ci

      - name: Sync manifest into web/src/data (mirror of data/manifests/latest.json)
        # The web build imports `web/src/data/manifest.json`, which is a
        # separate committed copy of `data/manifests/latest.json`.
        # Without this `cp`, a manifest update lands in `data/` but the
        # deployed bundle ships the stale checked-in copy. Mirrors the
        # step from the deleted `deploy-ui.yml`.
        run: cp data/manifests/latest.json web/src/data/manifest.json

      # actions/setup-python v5.6.0 — pinned to SHA per SEC-001.
      # Matches the SHA used in poll-pursue.yml; bumps land via Dependabot.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Pillow (only dep needed by OG build scripts)
        # The OG build scripts read JSON + render PNG with Pillow. They
        # do not import the rest of pursue_index, so we avoid the heavy
        # core install (sqlalchemy, fastapi, surya/torch, etc.) and pin
        # Pillow to the same lower bound as pyproject.toml [CVE-2024-28219].
        run: pip install "pillow>=11.1.0"

      - name: Render default OG image (web/public/og.png)
        # Reads data/manifests/latest.json so the rendered card stays
        # in sync with the corpus stats. Idempotent / byte-stable —
        # safe to re-run on every deploy.
        run: python scripts/build_og_image.py

      - name: Render per-entry finds OG images (web/public/og/finds/*.png)
        # Reads web/src/content/finds/**/*.{md,mdx} and writes one
        # PNG per non-draft entry. Astro filters drafts via
        # !data.draft so the script does too — orphan PNGs would
        # otherwise ship for entries with no /finds/<slug> route.
        run: python scripts/build_finds_og_images.py

      - name: Build web assets (Astro -> web/dist)
        working-directory: web
        run: npm run build

      - name: Drift snapshot (worker constants <-> /api docs page)
        # Asserts `web/dist/api/index.html` contains required fragments
        # and that worker constants stay in sync with the docs page.
        # Mirrors the step from the deleted `deploy-ui.yml`; without
        # this, doc/worker drift deploys silently.
        working-directory: web
        run: npm run test:api-page

      - name: Deploy with wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Capture wrangler output to a log so the failure step can tail
        # it. tee preserves real-time console output for live debugging
        # while writing the same bytes to the log file.
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log
          # Pull the version ID out of wrangler's output for the run
          # summary. wrangler prints lines like:
          #   Current Version ID: 12345678-abcd-1234-5678-abcdef012345
          # Broader pattern (case-insensitive 'version id', accepts the
          # 'Worker Version ID' / 'Deployment ID' variants wrangler uses
          # across 3.x/4.x) keyed on the trailing UUID shape so a label
          # tweak upstream doesn't degrade the summary to 'unknown'.
          # Wrapped in `set +o pipefail` + `|| true` so a renamed/missing
          # line never fails the step after a successful deploy
          # (otherwise the failure-issue path fires on a green deploy).
          set +o pipefail
          VERSION_ID=$(grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' wrangler-deploy.log \
            | tail -1 || true)
          set -o pipefail
          echo "version_id=${VERSION_ID:-unknown}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Append deploy summary
        if: always()
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "## CF Workers fallback deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            echo "- Outcome: \`${OUTCOME}\`"
            echo "- Worker version ID: \`${VERSION_ID:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update deploy-failure issue
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        # Reuse a single open issue rather than spamming a new one per
        # failure. If an open `deploy-failure` issue exists, append a
        # comment; otherwise open a fresh one. Body links to the run
        # URL only (no log tail) — wrangler best-effort redacts secrets
        # in its output, but a future plugin or HTTP error body could
        # echo the CF token; the run URL is repo-read-gated and shows
        # the same content in a place that respects org visibility.
        run: |
          BODY=$(cat <<EOF
          GH Actions wrangler-deploy fallback failed.

          - Commit: \`${COMMIT_SHA}\`
          - Run: ${RUN_URL}

          Open the run URL above for full \`wrangler deploy\` output
          (the log tail is intentionally not embedded here; see
          comment in workflow file).

          Live Worker may be stale until either CF Workers Builds catches up or this is fixed and re-run.
          EOF
          )
          # `--jq '.[0].number'` returns the literal string `null` for
          # an empty array, which would make EXISTING non-empty and
          # send the script down the `gh issue comment "null"` path
          # (failing instead of opening the first deploy-failure
          # issue). `// empty` collapses null to the empty string so
          # the `[ -n "$EXISTING" ]` guard works correctly.
          EXISTING=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "deploy-cf: wrangler deploy failed on ${COMMIT_SHA:0:12}" \
              --body "$BODY" \
              --label "deploy-failure"
          fi

      - name: Propagate failure exit code
        if: steps.deploy.outcome == 'failure'
        run: exit 1
