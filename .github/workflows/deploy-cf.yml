name: Deploy to Cloudflare Workers (fallback)

# Fallback CI for `npx wrangler deploy`. The primary deploy path is the
# Cloudflare Workers Builds pipeline configured in the CF dashboard
# (see wrangler.jsonc header). That pipeline has stalled multiple times
# (2026-05-09: PRs #6-#17 merged but the live worker stayed pinned to a
# pre-#6 build until the operator manually ran `npx wrangler deploy`),
# so this workflow exists as a redundant deploy path that we control.
#
# When this fires *and* CF Workers Builds is healthy, both will deploy
# the same commit — wrangler is idempotent on identical bundles, the
# second deploy just produces a new version pointing at the same code.
#
# Required repo secrets (operator must set in repo settings):
#   CLOUDFLARE_API_TOKEN  — same value as PURSUE_CF_API_TOKEN in .env
#   CLOUDFLARE_ACCOUNT_ID — same value as PURSUE_CF_ACCOUNT_ID in .env
#
# Operational dependencies (mirrors poll-pursue.yml SEC-001/002):
# * Action pinning: `actions/checkout` and `actions/setup-node` are
#   pinned to commit SHAs. Bumps land via Dependabot
#   (`.github/dependabot.yml`, `github-actions` ecosystem).
# * No pip installs here — pure Node + wrangler.
# * Failure-issue pattern mirrors poll-pursue.yml: on deploy failure,
#   open or update a `deploy-failure` issue with the run URL + tail of
#   wrangler output so the operator gets paged via GitHub notifications.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize deploys: only one in flight at a time, and cancel any
  # stale queued/running deploys when a newer commit lands. This avoids
  # racing two `wrangler deploy` calls and avoids deploying an
  # already-superseded commit.
  group: deploy-cf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # for the failure-issue step below
    steps:
      # actions/checkout v4.2.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      # actions/setup-node v4.4.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Node 20 LTS — wrangler supports >=20 and Astro 6 supports
          # >=20.10. Using 20 (not 22 like deploy-ui.yml did) keeps the
          # CI image identical to what wrangler tests against upstream.
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Ensure deploy-failure label exists
        # Idempotent — `gh label create --force` is upsert.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create deploy-failure \
            --color B60205 \
            --description "GH Actions wrangler-deploy fallback failed; live worker may be stale" \
            --force

      - name: Install web deps (npm ci, exact lockfile)
        working-directory: web
        run: npm ci

      - name: Build web assets (Astro -> web/dist)
        working-directory: web
        run: npm run build

      - name: Deploy with wrangler
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Capture wrangler output to a log so the failure step can tail
        # it. tee preserves real-time console output for live debugging
        # while writing the same bytes to the log file.
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log
          # Pull the version ID out of wrangler's output for the run
          # summary. wrangler prints lines like:
          #   Current Version ID: 12345678-abcd-...
          VERSION_ID=$(grep -oE 'Current Version ID: [0-9a-f-]+' wrangler-deploy.log \
            | tail -1 | awk '{print $4}')
          echo "version_id=${VERSION_ID:-unknown}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Append deploy summary
        if: always()
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "## CF Workers fallback deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            echo "- Outcome: \`${OUTCOME}\`"
            echo "- Worker version ID: \`${VERSION_ID:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update deploy-failure issue
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        # Reuse a single open issue rather than spamming a new one per
        # failure. If an open `deploy-failure` issue exists, append a
        # comment; otherwise open a fresh one. Tail of wrangler output
        # is included for at-a-glance triage.
        run: |
          TAIL=$(tail -n 50 wrangler-deploy.log 2>/dev/null || echo "(no log captured)")
          BODY=$(cat <<EOF
          GH Actions wrangler-deploy fallback failed.

          - Commit: \`${COMMIT_SHA}\`
          - Run: ${RUN_URL}

          Last 50 lines of \`wrangler deploy\` output:

          \`\`\`
          ${TAIL}
          \`\`\`

          Live Worker may be stale until either CF Workers Builds catches up or this is fixed and re-run.
          EOF
          )
          EXISTING=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "deploy-cf: wrangler deploy failed on ${COMMIT_SHA:0:12}" \
              --body "$BODY" \
              --label "deploy-failure"
          fi

      - name: Propagate failure exit code
        if: steps.deploy.outcome == 'failure'
        run: exit 1
