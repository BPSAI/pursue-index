name: tests

# The Python test suite on every PR that changes code, so a PR touching only
# src/ or tests/ no longer opens with no checks (#205). Credential-free:
# read-only token, no secrets.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "pyproject.toml"
      - "requirements-*.txt"
      - "Makefile"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history with remote branches: the ingest tests run the poll
      # freshness check, which refuses a checkout without origin/main.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          # The job runs PR code; it needs no token after checkout.
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install poppler and tesseract (pdf2image, pytesseract)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
      # Installed from this checkout, so the tests that run the `pursue` CLI
      # exercise the code under review. No GPU stack: OCR models are not
      # needed by the suite.
      - name: Install the package
        run: python -m pip install -e ".[dev,llm,embed,r2,og,build-tools]"
      # needs_web_dist tests check the built site (web/dist). They run in the
      # release gate after its Astro build; here they are deselected by name,
      # visibly, rather than left to fail.
      - name: Pytest
        env:
          NO_COLOR: "1"
          TERM: dumb
          COLUMNS: "200"
        run: python -m pytest -q -m "not needs_web_dist"
