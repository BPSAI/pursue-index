name: Wayback save after tranche change

# Submits the live pursueindex.com sitemap to the Internet Archive
# Wayback Machine so a snapshot is captured against the public URL
# (independent of CF, R2, or origin availability). This is the
# Sprint 4a Theme-A complement to the `r2_archive_assets` bytes-side
# preservation: byte-archive proves *what was served*, Wayback proves
# *that the public URL rendered that content at this date*.
#
# Triggers (Sprint 4c cadence change 2026-05-17):
#   * `release: published` — fires on every formal GitHub release
#     (operator-cut version tag). Wayback is forensic preservation
#     of public URL state at version cuts, not real-time tracking.
#   * `schedule: weekly` (Sunday 08:00 UTC) — drift-catcher between
#     releases. The 24h freshness gate in the script means most URLs
#     will be skipped on each run; the cron exists to catch URLs
#     modified outside a release (e.g., content-collection updates
#     between tags).
#   * `workflow_dispatch` — manual button for ad-hoc snapshots.
#
# REMOVED 2026-05-17 (per operator): the prior `push` trigger on
# narrowed paths. Reality: the script takes 30-90 min wall-clock per
# run because Wayback's save endpoint takes ~10-30 s per URL (script
# delay is 2s; Wayback latency is the dominant cost). At ~1 min of
# billable GHA minutes per minute of script wall-clock, every
# render-affecting push was burning 30-90 GHA min for trivial benefit
# (most pushes don't change content beyond the prior snapshot).
# Release-trigger + weekly cron + on-demand covers the use case at
# a fraction of the minute cost.
#
# Synchronization with CF deploy: release-triggered runs fire after
# the release is published, which the operator does after confirming
# CF Workers Builds finished deploying. Manual + cron paths use the
# 5-min sleep below as a defensive wait. If CFWB stalls, Wayback
# captures the pre-deploy version — affects snapshot quality, not
# pipeline correctness. The next run picks up the post-stall version
# once the freshness window expires.
#
# Wayback rate-limits hard: the script defaults to 2 s between
# submissions and reads `data/wayback-history.json` to skip URLs
# saved within the last 24 h. The history file is committed back
# to the repo at the end of the run so subsequent runs don't
# re-save still-fresh URLs.
#
# Failures on individual URLs (429, timeout, bot challenge) are
# logged as ``::warning::`` annotations but don't fail the workflow
# (H3 fix-pass: the script returns 0 on per-URL failure so the
# commit-back step still runs and partial-success history persists).
# Network-level failure (sitemap unreachable, IA outage) is a soft-
# failure: the script logs the issue and exits 0.

on:
  release:
    types: [published]
  schedule:
    # Sunday 08:00 UTC — low-traffic window for the drift-catcher.
    # Offset from any other cron's `0 8 * * *` pattern so workflows
    # don't pile up on the same minute boundary.
    - cron: '7 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write   # commit-back wayback-history.json

# 2026-05-29 incident fix: cancel-in-progress: true so a burst of
# release events (e.g. backfilling multiple missing release tags at
# once) doesn't serialize N redundant runs through this group. Only
# the latest release-snapshot has informational value; earlier ones
# in a burst are obsolete the moment the next release ships.
# Previous `false` setting let 8 release events from a 19-second
# backfill window queue 7 runs behind the first, burning 11h 15m of
# GHA runtime across two surviving runs. See
# `findings/2026-05-29-wayback-workflow-11h-burn.md` in pursue-opsec.
concurrency:
  group: wayback-after-deploy
  cancel-in-progress: true

jobs:
  wayback-save:
    runs-on: ubuntu-latest
    # 2026-05-29 incident fix: cap runaway runs at 6h. The 325-URL
    # sitemap at ~60s per Wayback /save/ call ≈ 5.5h per run today;
    # 6h gives headroom while preventing the unbounded burn pattern
    # the incident exposed. If a future run hits this, investigate
    # Wayback latency / sitemap growth before raising.
    timeout-minutes: 360
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # actions/setup-python v6.2.0 — pinned to SHA per SEC-001.
      # Matches the SHA used by poll-pursue.yml and deploy-cf.yml.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Wait for CF Workers Builds deploy + edge warm (5 min)
        # Wayback's snapshot reads from the live origin; if we fire
        # before the CFWB deploy completes + the edge warms, IA captures
        # the previous version. The CFWB pipeline triggers on the same
        # `push` to main as this workflow; a fixed 5 min wait covers
        # the typical 2-3 min CFWB latency plus edge warm-up.
        # workflow_dispatch is exempt — operator presumably ran this
        # manually because the deploy already landed.
        if: github.event_name == 'push'
        run: sleep 300

      - name: Submit live sitemap URLs to Wayback
        # The script reads the live sitemap-index from pursueindex.com
        # (post-deploy), filters out URLs saved within the last 24 h,
        # and submits the rest with a 2s between-request delay.
        #
        # 2026-05-29 incident: real-world runtime is ~5.5h, not 6 min.
        # The 2-second delay is the BETWEEN-REQUEST pause; Wayback's
        # /save/ endpoint actually performs the archive and averages
        # ~60s per call at current load (325 URLs × ~60s = ~5h 30m).
        # The job-level timeout-minutes: 360 caps a stuck run at 6h
        # so an unexpected latency spike can't burn beyond a known
        # budget.
        # H3: per-URL failures surface as ``::warning::`` annotations
        # but do NOT mark the step as failed.
        run: |
          python scripts/wayback_save.py \
            --sitemap https://pursueindex.com/sitemap-index.xml \
            --history data/wayback-history.json \
            --window-hours 24 \
            --delay-seconds 2

      - name: Commit updated wayback-history.json
        # H2: stage the file BEFORE the diff so newly-created (untracked)
        # history files are detected. ``git diff --quiet <path>`` does
        # not catch untracked files; ``git diff --cached --quiet`` does.
        # H3: ``if: always()`` ensures the commit-back step runs even
        # when the save step produced ``::warning::`` annotations
        # (per-URL failure should not lose freshness state).
        # H4: ``git pull --rebase`` before push avoids races with other
        # workflows that also write to main (mirrors verify-assets-daily).
        #
        # 2026-05-29 incident fix: ``git pull --rebase --autostash``.
        # The previous "Codex re-review P1 (2026-05-17)" fix asserted
        # "rebase MUST happen BEFORE ``git add`` because rebase doesn't
        # touch it because it operates on committed history only." That
        # claim is wrong: ``git pull --rebase`` refuses to start when the
        # working tree has unstaged changes — regardless of which files
        # are dirty. The wayback_save.py script writes data/wayback-
        # history.json incrementally during the run (so partial runs
        # don't lose freshness state), leaving the file modified-
        # unstaged when the script exits. The previous fix solved the
        # wrong case (staged-index from running ``git add`` before
        # rebase); the actual bug is the unstaged write the script
        # itself creates. ``--autostash`` lets git stash the working-
        # tree change, run the rebase, then re-apply — the standard fix
        # for "I have local changes and need to sync with main."
        # See findings/2026-05-29-wayback-workflow-11h-burn.md in opsec.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Hotfix 2026-05-17: the save step may exit 0 without ever
          # creating ``data/wayback-history.json`` (e.g., sitemap fetch
          # 403'd by CF, OR every URL submission failed). ``git add``
          # on a missing path exits 128; guard before staging.
          if [ ! -f data/wayback-history.json ]; then
            echo "[wayback] no history file produced this run; nothing to commit"
            exit 0
          fi
          git pull --rebase --autostash origin main
          git add data/wayback-history.json
          if git diff --cached --quiet; then
            echo "[wayback] no history change; nothing to commit"
            exit 0
          fi
          git commit -m "chore(wayback): update save history after wayback-after-deploy"
          git push origin main
