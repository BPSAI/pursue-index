name: Release gate — deploy-side coherence

# Deterministic AC for PRs that touch the manifest, snapshot mirrors,
# alias map, or finds entries. Closes the entire class of bugs that
# hit main on 2026-05-12 (four hot-fixes in one evening for stale
# build-side files vs pipeline-side source-of-truth) by running the
# same coherence checks in CI rather than relying on operator
# attentiveness at the moment of promotion.
#
# Operator framing (verbatim, captured in the proposal doc):
#   "The volume is such that you will always use context, so a
#    deterministic checklist and gated AC are the answer."
#
# This workflow IS that gated AC. Nine checks (some are existing tests,
# some are new for this gate):
#
#   1. Manifest coherence    — latest.json == web/src/data/manifest.json
#   2. Snapshot mirror       — pipeline + web snapshot dirs in sync
#   3. Snapshot index drift  — index.json matches filesystem
#   4. Snapshot byte parity  — paired snapshots are byte-equal
#   5. Payload coverage      — every derived payload under
#                              web/public/data/ covers the entries the
#                              manifest and pages.json make eligible
#   6. Citation resolution   — every <Cite> in /finds resolves
#   7. Build + coverage      — npm run build + every card has a page
#                            + every alias terminal has a page
#   8. CI-wiring regression  — the #162 fix stays fixed: post-deploy verify
#                              runs with no third-party deps, and no other
#                              workflow script slips the same way
#   9. Worker memory budget  — Worker test suite (including the #159/#161
#                              cold-retrieval 64 MiB isolate budget) and
#                              the retrieve-rows payload it depends on
#
# Each step fails fast with an actionable one-line message so the
# operator sees "fix X then re-push" instead of a wall of green
# except one buried red.
#
# Paths gating: scoped to files that can cause a sync gap. PRs that
# only touch worker code or finds entries don't get blocked on
# build-side rebuilds — see the `on.pull_request.paths` filter below.

on:
  pull_request:
    paths:
      - "data/manifests/**"
      - "web/src/data/manifest.json"
      - "web/public/data/snapshots/**"
      - "data/card-aliases.json"
      - "web/public/data/card-aliases.json"
      - "web/src/content/finds/**"
      # LS1.4 — GEO discovery surfaces and the generator that emits them.
      # A manifest change already fires this workflow (see above), which is
      # what catches a tranche landing without a regeneration; these entries
      # additionally catch a hand-edit of the files or a generator change.
      - "web/public/llms.txt"
      - "web/public/llms-full.txt"
      - "scripts/build_llms_txt.py"
      - "src/pursue_index/geo/**"
      # T47.11 — the derived payloads the coverage gate checks, plus the
      # predicate declarations and the gate itself. A manifest change
      # already fires this workflow, which is what catches a tranche
      # landing without a rebuild; these entries additionally catch a
      # hand-edited payload, a re-OCR that changes pages.json, or a
      # predicate edit that would quietly widen an exclusion.
      - "web/public/data/embed_index.json"
      - "web/public/data/atlas-layout.json"
      - "web/public/data/video-posters/index.json"
      - "web/public/data/thumbs/index.json"
      - "web/public/data/pages.json"
      - "web/public/data/pages.json.*"
      - "web/public/data/embed_index.json.*"
      - "tests/support/payload_coverage.py"
      - "tests/support/payload_specs.py"
      - "tests/integration/test_derived_payload_coverage.py"
      # ALTR Phase 2 (PR #79) data surfaces — refreshing the verdict
      # bundle, mutating byte-history, or editing the exclusion file
      # all need the URL-stability / stale-exclusion / bundle-symmetry
      # invariants to fire before deploy. Replaced the stale
      # `web/src/data/altered-diffs.json` entry (file retired in
      # v1.2.2). Vaivora PR #79 round-3 P1 #2.
      - "data/byte-history-exclusions.json"
      - "data/asset-bytes-registry.jsonl"
      - "web/src/data/byte-history.json"
      - "web/src/data/verdict-bundle.json"
      # Vaivora PR #79 round-4 P1 #2: schema-gate-relevant lib +
      # build-script files. A pure-code change to
      # EXPECTED_BUNDLE_SCHEMA / EXPECTED_VERDICT_SCHEMA, the
      # V2_CATEGORIES vocab, the archive-key regex, or the
      # exclusion builder would otherwise bypass the very test
      # suite that verifies them. Not every web/src/lib/** file is
      # listed — manifest-loader.ts intentionally fires via
      # manifest.json changes since it's a thin re-exporter (per
      # Vaivora round-6 P2 #3).
      - "web/src/lib/verdict-bundle*.ts"
      - "web/src/lib/byte-display.ts"
      - "web/scripts/build_byte_history.mjs"
      - "web/scripts/build_byte_history.test.mjs"
      # Vaivora PR #79 round-7 P1 + round-9 P1 #1: the lockstep
      # test in web/src/lib/byte-display.test.ts imports
      # ARCHIVE_EXT_TO_CONTENT_TYPE from worker/pdf.js. Use a
      # broader glob (was the exact path) so a future refactor
      # that moves the constant to a sibling worker/*.js file
      # (e.g., worker/contracts/archive-mime.js) keeps firing the
      # gate. Worker is small; over-triggering cost is negligible
      # vs. the silent-drift risk.
      - "worker/**/*.js"
      # Vaivora PR #79 round-5 P2 #1: Astro page changes that
      # refactor pill filters, change cross-link targets, or remove
      # categoryClass() calls should fire the gate even if no data
      # or lib file changes.
      #
      # GitHub Actions paths use minimatch glob syntax where `[...]`
      # is a character class. Literal square brackets in Astro
      # dynamic-route filenames must be matched via a wildcard
      # instead of escaped — using `card/*.astro` since the card/
      # directory contains exactly one file. Same for altered/**
      # (which catches `altered/[card_id].astro` via the `**` glob
      # without the brackets appearing in the pattern itself).
      - "web/src/pages/altered.astro"
      - "web/src/pages/altered/**"
      - "web/src/pages/card/*.astro"
      # Static-asset size budget. Cloudflare Workers rejects the whole
      # deploy when any single static asset exceeds 25 MiB, so every file
      # that ships (anything under web/public) is gated at 24 MiB; payloads
      # over it are published as parts + a `<name>.chunks.json` manifest.
      # The chunk writer/loader are listed so a change to the format fires
      # the gate too.
      - "web/public/**"
      - "scripts/check_asset_budget.py"
      - "scripts/chunk_public_assets.py"
      - "src/pursue_index/release/chunked_asset.py"
      - "web/src/lib/chunked-asset.js"
      # #162: the post-deploy-verify import-isolation regression test and
      # the cross-workflow dep-free-script sweep (test 8, below) exist to
      # catch exactly the class of change these paths cover — a workflow
      # gaining a script invocation, or that script gaining an import,
      # without the job installing deps first. `.github/workflows/*.yml`
      # is broader than just this file (was `release-gate.yml` only, per
      # Nayru PR #79 round-5 P2 #4 — a PR that edits the gate itself
      # should fire the gate); any workflow edit can introduce the #162
      # bug class, so any workflow edit should re-run the sweep.
      # `scripts/**` (not just the scripts a dep-free job currently
      # invokes) because the sweep also follows each invoked script's
      # local-import closure — a sibling module under scripts/ (e.g.
      # `_wayback_helpers.py`, `registry_root.py`) can introduce the same
      # class of break without the entrypoint script itself changing.
      # Codex PR #163 round-2 P2: a narrower list would need its own
      # test to keep it from drifting out of sync with the sweep.
      - ".github/workflows/*.yml"
      - "scripts/**"
      - "tests/unit/test_runbook_verify_deploy_isolated_import.py"
      - "tests/unit/test_workflow_scripts_dep_free_when_no_install.py"
      # #159/#161: the Worker's cold-retrieval memory budget (64 MiB, half
      # the 128 MiB isolate limit) and the retrieve-rows payload it reads
      # instead of parsing the whole of pages.json. Test 9, below.
      - "worker/**"
      - "web/public/data/retrieve/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 — pinned to SHA per SEC-001.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v6.0.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install Python test deps
        # Most gates are pure stdlib + pytest, but test_finds_validator.py
        # imports ``pursue_index.finds_validator``, and the package
        # __init__ pulls structlog + pydantic settings — so a pytest-only
        # install ModuleNotFoundErrors on collection (red since
        # 2026-05-28). Install the package (editable). Still far faster
        # than the downstream npm install + Astro build, so the fail-fast
        # ordering of these cheap gates holds.
        run: pip install -e . pytest

      # ---------------------------------------------------------------
      # Cheap unit gates — run first so we fail fast before npm install.
      # ---------------------------------------------------------------
      - name: 1+2+3+4 — Snapshot mirror coherence (4 invariants)
        # latest.json byte-equal to build manifest; pipeline/web snapshot
        # dirs in sync; index.json covers web side; paired snapshots
        # byte-equal. All four invariants in one test file.
        run: pytest tests/unit/test_snapshot_mirror_coverage.py -v

      - name: 4b — GEO discovery metadata freshness (LS1.4)
        # llms.txt / llms-full.txt describe the corpus to model crawlers. They
        # were hand-maintained, so a tranche that added cards left them
        # advertising the previous release with nothing to catch it. The
        # provenance line each carries is compared against the manifest; a
        # mismatch means regenerate with `python scripts/build_llms_txt.py`.
        # Credential-free and offline — reads only committed files.
        run: python scripts/build_llms_txt.py --check

      - name: 4c — Derived payload coverage (every payload covers the manifest)
        # T47.11. Freshness was gated for some surfaces; coverage was
        # gated for none — no shipped artifact was ever asserted to
        # cover the sources it is derived from, so a tranche could land
        # green while search, the atlas, posters and thumbnails still
        # described the previous release. Parametrized over the specs in
        # tests/support/payload_specs.py, where each payload's
        # eligibility predicate (and what it legitimately excludes) is
        # written down in one place. Reads only committed files —
        # latest.json and pages.json — so it needs no credentials, no
        # NAS mount and no network, and runs here with the cheap gates
        # rather than after the Astro build.
        run: pytest tests/integration/test_derived_payload_coverage.py -v

      - name: 4d — Static asset size budget (web/public)
        # Fail-closed: Workers refuses any static asset over 25 MiB and the
        # deploy fails on the first one. Every file under web/public must
        # be <= 24 MiB (1 MiB margin), and every *.chunks.json manifest must
        # match its parts. Fix an oversize payload with
        # `python scripts/chunk_public_assets.py` (lossless split).
        run: python scripts/check_asset_budget.py web/public

      - name: 4e — Retrieve-rows payload freshness (Worker read path)
        # scripts/build_retrieve_rows.py derives web/public/data/retrieve/
        # from the committed embed_index.json + pages.json; the Worker
        # reads only this payload on /api/retrieve and /api/chat instead
        # of parsing all of pages.json (see #159/#161). A stale committed
        # payload here is the same class of drift as 4b/4c — reads only
        # committed files, so it runs with the cheap gates.
        run: python scripts/build_retrieve_rows.py --check

      - name: 4f — Post-deploy verify runs with no third-party deps (#162)
        # Regression test for the fix in PR #163: the post-deploy-verify
        # workflow job installs no dependencies, so the script must not
        # import pursue_index via the package path (which runs
        # __init__.py and requires structlog/pydantic-settings).
        run: pytest tests/unit/test_runbook_verify_deploy_isolated_import.py -v

      - name: 4g — No workflow script imports pursue_index without deps (#162)
        # Sweeps every .github/workflows/*.yml job; for any job with no
        # `pip install` step, statically checks that its scripts don't
        # import pursue_index at module level. Guards the whole bug class
        # 4f fixed one instance of, so a future workflow migration can't
        # reintroduce it elsewhere.
        run: pytest tests/unit/test_workflow_scripts_dep_free_when_no_install.py -v

      - name: 5 — Citation resolution (every <Cite> in /finds)
        # Existing test; included here for the single-status-check
        # ergonomics. A finds entry citing a dead card_id is a silent
        # 404 in prod editorial credibility.
        run: pytest tests/unit/test_finds_citations.py -v

      - name: 5b — Finds structural validator (every .mdx)
        # Closes the autonomous-finds-pipeline plan's "structural
        # validation" gate at the public-repo boundary. Catches missing
        # frontmatter, citation density below 3, missing methodology
        # block. Soft word-count warnings don't gate. Both human-written
        # and bot-opened entries pass through this gate identically.
        run: pytest tests/unit/test_finds_validator.py -v

      # ---------------------------------------------------------------
      # Build-dependent gates — need npm + Astro to produce web/dist/.
      # ---------------------------------------------------------------
      # actions/setup-node v6.4.0 — pinned to SHA per SEC-001.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Vaivora PR #79 round-8 P0: bumped from "20" to match
          # web/package.json:engines ">=22.12.0". The step 5c invokes
          # `npm run test:lib` which runs `node --test src/lib/*.ts` —
          # native TypeScript stripping is on by default only at Node
          # ≥22.18. "22.12" (the prior pin) is below that threshold, so
          # test:lib ERR_UNKNOWN_FILE_EXTENSION'd on every .ts test —
          # the second reason release-gate was red since 2026-05-28
          # (the first, the missing package install, masked it via
          # fail-fast). Pin ≥22.18 so stripping is default, matching the
          # comment's own stated requirement and the Node 24 local dev env.
          node-version: "22.18"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps + build
        # `npm ci` is reproducible from the committed lockfile; `npm
        # install` would float minor versions. Build output lands in
        # web/dist/ for the test-api-page snapshot + the coverage
        # tests below. The verdict-bundle.ts module runs
        # assertBundleSchema + assertBundleStatsConsistent at module
        # scope on first import (Vaivora PR #79 round-4 P1 #1 — the
        # asserts moved OUT of loadVerdictBundle() so they fire on
        # import regardless of consumer call patterns); a bundle
        # drift fails this step loudly.
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: 5c — ALTR invariant tests (strict mode)
        # The URL-stability / stale-exclusion / bundle-symmetry /
        # byte-history-vs-manifest / schema-gate tests are the
        # recurrence-detector gates for the 2026-05-11 pipeline
        # misroute event and the follow-on schema drift.
        # PURSUE_STRICT_INVARIANTS=1 turns the file-missing skip
        # path in the byte-history tests into a hard fail so CI
        # can't pass on stripped data. Scoped to test:byte-history
        # + test:lib only (Nayru PR #79 round-4 P1): no point
        # re-running test:api-page or the build-script unit tests
        # here — they cover unrelated surfaces.
        working-directory: web
        env:
          PURSUE_STRICT_INVARIANTS: "1"
        run: npm run test:byte-history && npm run test:lib

      - name: 6a — Card-page coverage (every manifest card_id → dist page)
        run: pytest tests/integration/test_card_page_coverage.py -v

      - name: 6b — Alias destinations (every alias terminal → dist page)
        run: pytest tests/integration/test_alias_destinations.py -v

      - name: 6c — Static asset size budget (web/dist)
        # Same gate over the built tree wrangler uploads, so an asset the
        # build itself generates (not only what is committed under
        # web/public) cannot slip past the 24 MiB budget.
        run: python scripts/check_asset_budget.py web/dist

      - name: Install worker deps (npm ci)
        # Node is already set up above (22.18, for the web build) — reused
        # here rather than a second actions/setup-node step. worker/ has
        # its own lockfile and is not part of the web/ npm workspace.
        working-directory: worker
        run: npm ci

      - name: 9 — Worker test suite (incl. #159/#161 cold-retrieval budget)
        # node --test tests/*.test.js. Includes cold_memory.test.js: a
        # child-process probe (--expose-gc) asserting a cold /api/retrieve
        # over the committed corpus peaks under 64 MiB — half the 128 MiB
        # Workers isolate limit — the AC #159 asked for so corpus growth
        # regresses in CI, not production.
        working-directory: worker
        run: npm test
