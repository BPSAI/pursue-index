name: "Finds — curated reading guides"
description: |
  Coverage of the /finds index + each entry detail page. Validates
  the Cite component rendering, sources rail, citation chip
  resolution, and editorial-bar invariants visible in the rendered
  HTML.

  String-match conventions: section headings render with
  `text-transform: uppercase` styling, so a verify for "What this
  isn't" matches against the rendered "WHAT THIS ISN'T". Treat
  heading verifies as case-insensitive unless explicitly stated.
tags: [finds, regression, ui]
preconditions:
  - "App accessible at ${base_url}"
  - "Splash cookie set"

scenarios:
  - name: "/finds index lists all current entries"
    # Current set (21 entries as of 2026-05-15): apollo-11-debriefing,
    # apollo-17, dow-d23-arabian-gulf-october-2023, dow-d32-syria-
    # october-2024, dow-d33-aegean-sea-october-2023, dow-incidents-1-
    # 100, dow-uap-d20-iraq-2023-replaced, fbi-1947-dallas-teletype,
    # fbi-62-hq-83894-readers-guide, fbi-62-hq-83894-section-6-
    # removed-2026-05, fbi-usper-2025-orb, hanawalt-cobalt-ray-1966,
    # kenneth-arnold-june-24-1947, lapaz-green-fireballs-1948-1950,
    # lowry-1949-ocr-limits, muroc-1947, nasc-state-extraterrestrial-
    # policy-memo-1963, oak-ridge-radar-january-1951, presley-oak-
    # ridge-photographs-1947, rhodes-photographs-phoenix-1947,
    # whats-not-uap.
    steps:
      - navigate: "${base_url}/finds"
      - verify: "Page heading reads 'Finds' or 'Curated finds' or equivalent"
      - verify: "At least 20 entries are listed (current count: 21 as of 2026-05-15)"
      - verify: "Each entry shows its title and a summary line"
      - verify: "Entries are clickable and navigate to their detail page"
      - verify: "Both early-era entries (muroc-1947, kenneth-arnold-june-24-1947, fbi-1947-dallas-teletype) and modern-era entries (dow-d32-syria-october-2024, fbi-usper-2025-orb) are present"

  - name: "muroc-1947 entry renders with chips and sources rail"
    steps:
      - navigate: "${base_url}/finds/muroc-1947"
      - verify: "Page title contains 'Muroc' or 'July 8, 1947' or 'Edwards-AFB'"
      - verify: "Sources rail at top or bottom shows at least one card chip (FBI 62-HQ-83894 Section 3)"
      - verify: "Inline Cite chips appear next to quoted passages — mono uppercase tracking, signal-cyan colored"
      - verify: "Verbatim quotes are inside <blockquote> elements (rendered with the brand's quote treatment)"

  - name: "Cite chip click-through goes to correct card+page"
    steps:
      - navigate: "${base_url}/finds/muroc-1947"
      - click: "the first inline Cite chip in the article body"
      - wait: "2"
      - verify: "Browser navigated to /card/[card_id] (full sha256 prefix, not 8-char short)"
      - verify: "URL has a #page-N anchor"
      - verify: "On the card page, the OCR transcript scrolls to the cited page"

  - name: "apollo-17 entry shows the 'expectation calibration' framing"
    steps:
      - navigate: "${base_url}/finds/apollo-17"
      - verify: "Entry explicitly mentions reentry plasma OR aircraft carrier OR ALFMED"
      - verify: "Entry has a 'What this isn't' or 'What we're not claiming' section (case-insensitive — section heading renders uppercase)"
      - verify: "Entry cross-links to /finds/muroc-1947 OR /finds/whats-not-uap"

  - name: "whats-not-uap entry surfaces DOW-UAP-D48"
    steps:
      - navigate: "${base_url}/finds/whats-not-uap"
      - verify: "Entry title or body mentions 'DOW-UAP-D48' or 'launch-range safety' or 'space-booster failures'"
      - verify: "Page links to /finds/apollo-17 OR /finds/muroc-1947 (cross-references)"

  - name: "fbi-62-hq-83894-readers-guide is the navigation aid"
    steps:
      - navigate: "${base_url}/finds/fbi-62-hq-83894-readers-guide"
      - verify: "Each of 10 sections is referenced (Section 1 through Section 10)"
      - verify: "Sources rail shows multiple FBI section card chips"
      - verify: "Entry cross-links to /finds/muroc-1947"

  - name: "Unknown card_id Cite chip degrades gracefully"
    # This is hard to test without a deliberate scratch entry. Skip if not
    # applicable; the unit was tested by the agent during migration.
    steps:
      - navigate: "${base_url}/finds/muroc-1947"
      - verify: "No 'UNKNOWN CARD' amber warning chips appear in published entries (all citations resolve cleanly against the manifest)"
