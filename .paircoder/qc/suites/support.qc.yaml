name: "Support — free tier, BYOK, support project"
description: |
  Validates the /support page covers the three sections (free tier,
  BYOK setup walkthrough, support the project) and that the trust
  pitch language for BYOK is intact.
tags: [support, regression, ui]
preconditions:
  - "App accessible at ${base_url}"
  - "Splash cookie set"

scenarios:
  - name: "/support page renders with three sections"
    steps:
      - navigate: "${base_url}/support"
      - verify: "Heading reads 'How to use the chat without breaking the bank' or equivalent"
      - verify: "Section 'Free tier (default)' is visible"
      - verify: "Section 'BYOK · bring your own Anthropic key' is visible"
      - verify: "Section 'Support the project' is visible"

  - name: "Free tier section explains the rate limit + degrade"
    steps:
      - navigate: "${base_url}/support"
      - verify: "Section mentions a per-IP/24h cap (5 or current limit)"
      - verify: "Section mentions cache hits don't count against the cap"
      - verify: "Section mentions graceful degrade to keyword-only on global budget cap"

  - name: "BYOK section walks through Anthropic console setup"
    steps:
      - navigate: "${base_url}/support"
      - verify: "Section links to console.anthropic.com"
      - verify: "Section explains Settings → Billing → Settings → API Keys steps"
      - verify: "Trust pitch is present: 'localStorage only', 'never POSTed to our origin', verifiable in DevTools network tab"
      - verify: "BYOK unlocks listed: model picker (Sonnet/Opus), unlimited queries, no per-IP cap"

  - name: "Support section has GitHub link, no fake Stripe / Patreon"
    steps:
      - navigate: "${base_url}/support"
      - verify: "Section links to github.com/BPSAI/pursue-index"
      - verify: "Section links to /cite for citation format"
      - verify: "Section does NOT link to a placeholder Stripe / Patreon / Ko-fi (patron tier framed as roadmap, not live)"

  - name: "Nav includes SUPPORT link"
    steps:
      - navigate: "${base_url}/"
      - verify: "Header nav contains SUPPORT or similar entry"
      - click: "SUPPORT in nav"
      - wait: "1"
      - verify: "URL is now /support"
