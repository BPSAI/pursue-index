name: "Card detail — metadata, preview, navigation"
description: |
  Per-card detail page across PDF, IMG, and VID asset types. PDF cards
  embed an iframe to /pdf/<card_id>.pdf (Cloudflare Worker serves from
  R2 in prod; 404s in dev because the Worker doesn't run locally —
  see .paircoder/qc/config.yaml). IMG cards show the modal_image; VID
  cards render a DVIDS embed iframe.

  String-match conventions: badges + section headings carry CSS
  `text-transform: uppercase` / `tracking-[0.2em]`, so a verify for
  'Top Secret' should match against rendered 'TOP SECRET'. Treat all
  badge / heading verifies as case-insensitive unless the spec
  explicitly says otherwise.
tags: [regression, ui]
preconditions:
  - "App accessible at ${base_url}"

scenarios:
  - name: "PDF card renders header, metadata, and iframe preview"
    steps:
      - navigate: "${base_url}/card/0b298cfc9c65a4d6"
      - verify: "Type badge reads PDF (red signal tone)"
      - verify: "Agency line reads 'AGENCY · NASA'"
      - verify: "Card title contains 'Apollo 17' and 'Crew Debriefing'"
      - verify: "Metadata grid shows RELEASE, INCIDENT, LOCATION, TYPE values (some may be em-dash for missing)"
      - verify: "Source section heading reads SOURCE with a green '▸' marker"
      - verify: "An iframe is present and either loaded the war.gov PDF or shows the OPEN ↗ button to launch it externally"
      - verify: "Description section is shown with the FBI case-file blurb text"

  - name: "IMG card shows the modal image inline"
    steps:
      - navigate: "${base_url}/card/19b18b71420602c5"
      - verify: "Type badge reads IMG (green signal tone)"
      - verify: "An <img> element is rendered inside the SOURCE panel (not an iframe)"
      - verify: "The image src points at war.gov"

  - name: "VID card surfaces DVIDS embed iframe + DVIDS id"
    # Updated 2026-05-15: previously asserted a `[NO ASSET URL]` message,
    # but every current VID card has `dvids_video_id` set (28 of 28 in
    # tranche c9cc83fcaf43), so the SOURCE panel renders a DVIDS embed
    # iframe instead. The `[NO ASSET URL]` fallback only triggers if a
    # VID card lacks BOTH asset_url AND dvids_video_id — which is no
    # longer a case in the live corpus.
    steps:
      - navigate: "${base_url}/"
      - fill:
          field: "TYPE"
          value: "VID"
      - wait: "1"
      - click: "the first VID card in the filtered grid"
      - wait: "1"
      - verify: "Source panel shows a DVIDS embed iframe (src points at dvidshub.net/video/embed/<id>) — not the [NO ASSET URL] fallback"
      - verify: "An 'Open on DVIDS ↗' link is visible below the iframe"
      - verify: "DVIDS id code is visible (text 'DVIDS id:' followed by a numeric id in signal-violet)"

  - name: "Breadcrumb links navigate back to the index"
    steps:
      - navigate: "${base_url}/card/0b298cfc9c65a4d6"
      - click: "/INDEX breadcrumb link"
      - wait: "1"
      - verify: "Browser is now on the index page (URL ends with / or /index)"

  - name: "Direct deep-link to an unknown card_id 404s gracefully"
    steps:
      - navigate: "${base_url}/card/deadbeefdeadbeef"
      - verify: "Custom terminal-style 404 page renders"
      - check_console: "No errors except expected 404"

  - name: "Top Secret card renders classification badge + VIRIN in sidebar"
    # Added in tranche c9cc83fcaf43 (2026-05-15). 17 of 158 cards have
    # an explicit original_classification. Card 6bda02c546051f43 is
    # the only Top Secret card in the corpus (341_110448_Records_
    # Relating_to_the_Collection_..., DoD Air Staff intel records).
    steps:
      - navigate: "${base_url}/card/6bda02c546051f43"
      - wait: "1"
      - verify: "Sidebar ASSET section shows a 'Class:' label (case-insensitive — may render as 'CLASS:') and a 'Top Secret' badge (case-insensitive — renders as 'TOP SECRET' due to CSS uppercase; bordered, signal-amber tone)"
      - verify: "Sidebar ASSET section shows a 'VIRIN:' label and the value '260508-D-D0360-1004' (case-insensitive ok; VIRIN format is 260508-D-D0360-NNNN)"
      - verify: "VIRIN value has a hover tooltip mentioning DoDI 5040.02 OR 'Visual Information Record Identification Number'"
      - verify: "A 'declassified' note appears next to the classification badge in faint text (case-insensitive)"

  - name: "Secret-class card also shows classification badge"
    # Verifies the badge isn't specific to Top Secret.
    steps:
      - navigate: "${base_url}/card/9e677b8697685311"
      - wait: "1"
      - verify: "Sidebar shows 'Class:' label and a 'Secret' badge (both case-insensitive — render as 'CLASS:' and 'SECRET')"
      - verify: "Sidebar shows 'VIRIN:' label with a 260508-D-D0360 sequence"

  - name: "VIRIN-only card (no explicit classification) renders VIRIN but no badge"
    # ~131 of 158 cards have a VIRIN; only 17 have an explicit
    # classification. Cards without an explicit level should show
    # VIRIN alone, with no badge or label for classification.
    steps:
      - navigate: "${base_url}/card/973c1f75f55d0d39"
      - wait: "1"
      - verify: "Sidebar shows a 'VIRIN:' label with value (260508-O-D0360-1058 or similar; case-insensitive)"
      - verify: "No 'Class:' label is rendered anywhere in the sidebar (the card has no explicit classification recorded upstream — match is for the literal 'Class:' / 'CLASS:' label, not any unrelated occurrence of 'class' in HTML)"

  - name: "Gallery thumbnail uses upstream alt-text when present"
    # Tranche c9cc83fcaf43 added image_alt_text for 130 of 158 cards.
    # GalleryIsland.tsx prefers upstream alt-text (with redaction
    # suffix preserved) over the auto-generated title-based fallback.
    steps:
      - navigate: "${base_url}/gallery"
      - wait: "2"
      - verify: "At least one gallery tile's <img> alt attribute contains a sentence-like description (e.g. starts with 'Declassified', 'Brown file folder', 'Redacted', etc.) — not just a filename"
      - verify: "Redacted cards still have '(contains redactions)' appended to their alt text"
