name: "Card grid — filters, sort, views"
description: |
  Exercises every interactive control on the index page: query, agency
  filter, type filter, redacted-only toggle, sort, view toggle, and
  the URL-hash persistence that makes filters shareable.
tags: [regression, ui]
preconditions:
  - "App accessible at ${base_url}"

scenarios:
  - name: "Query narrows the result set"
    steps:
      - navigate: "${base_url}/"
      - verify: "Result counter near the top reads '161 / 161 RECORDS' (or close — manifest dependent)"
      - fill:
          field: "QUERY"
          value: "roswell"
      - wait: "1"
      - verify: "Result counter updated; fewer than 30 records shown"
      - verify: "At least one card mentions Roswell in the title or description"
      - check_console: "No errors"

  - name: "Agency filter restricts to FBI"
    steps:
      - navigate: "${base_url}/"
      - click: "AGENCY dropdown"
      - verify: "Dropdown lists at least: any agency, FBI, Department of War, NASA, Department of State"
      - fill:
          field: "AGENCY"
          value: "FBI"
      - wait: "1"
      - verify: "All visible cards show FBI as the agency badge"

  - name: "Type filter restricts to images"
    steps:
      - navigate: "${base_url}/"
      - fill:
          field: "TYPE"
          value: "IMG"
      - wait: "1"
      - verify: "All visible cards show the IMG badge (signal-green tone)"
      - verify: "Card count is 14 or close (manifest has 14 images)"

  - name: "Redacted-only checkbox filters the grid"
    steps:
      - navigate: "${base_url}/"
      - click: "REDACTED checkbox"
      - wait: "1"
      - verify: "All visible cards show the red REDACTED indicator"
      - verify: "Result counter is approximately 108 (manifest has 108 redacted cards)"

  - name: "View toggle switches between card and table modes"
    steps:
      - navigate: "${base_url}/"
      - verify: "Default view is the card grid (CARDS button looks selected)"
      - click: "TABLE button in the view toggle"
      - wait: "1"
      - verify: "Layout switches to a tabular view with columns for type, title, agency, dates"
      - click: "CARDS button in the view toggle"
      - verify: "Layout returns to the card grid"

  - name: "URL hash persists filters across navigation"
    steps:
      - navigate: "${base_url}/"
      - fill:
          field: "QUERY"
          value: "apollo"
      - wait: "1"
      - verify: "URL hash now contains 'q=apollo'"
      - click: "any visible card to open its detail page"
      - wait: "1"
      - click: "back to /INDEX breadcrumb or browser back"
      - wait: "1"
      - verify: "QUERY input still shows 'apollo' and result list is filtered (state restored from hash)"

  - name: "Empty state appears for impossible filter combinations"
    steps:
      - navigate: "${base_url}/"
      - fill:
          field: "QUERY"
          value: "zzzz_no_match_zzzz"
      - wait: "1"
      - verify: "A '[NO MATCH]' or similar empty-state message is visible"
      - verify: "The message is in-brand (mono font, signal-amber accent)"
