name: "Diff — populated comparison against immediate-prior snapshot"
description: |
  The /diff page compares the current manifest against the most recent
  PRIOR snapshot under /data/snapshots/. As of 2026-05-15 we have five
  snapshots committed (596cc188, 0d7e9ba1, 65572b38, 4a35f5596951,
  c9cc83fcaf43) so the page renders a populated comparison by default.

  History — earlier behavior compared against the OLDEST snapshot
  (Release 01 baseline), which produced a cumulative changelog
  instead of the per-tranche delta visitors expect. The 1-line fix
  in commit ef4d2ae switched the comparison to index.at(-2). The
  full snapshot-pair-selection plan
  (.paircoder/plans/diff-page-arbitrary-pair-selection.md) layers
  selectors + a timeline strip on top of this default — still queued.

  Most recent comparison (c9cc83fcaf43 vs 4a35f5596951) is metadata-
  only: 0 added, 0 removed, 122 field-only changes. So expect the
  page to render but with no added/removed sections — or with an
  in-brand "no card changes in this tranche" indicator if the UI
  surfaces that distinction.
tags: [regression, ui]
preconditions:
  - "App accessible at ${base_url}"

scenarios:
  - name: "Diff page loads and compares current vs immediate-prior snapshot"
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "Heading reads 'TRANCHE DIFF' or 'Tranche diff'"
      - verify: "Page shows either Added / Removed sections (with card titles linking to /card/[id]) OR an in-brand 'no card changes in this tranche' indicator"
      - verify: "Loading state ('LOADING SNAPSHOTS' or similar) was visible briefly then resolved"
      - check_console: "No errors. A 404 on /data/snapshots/index.json is NOT expected here (the file exists with 5 entries)"

  - name: "Comparison is against immediate-prior snapshot, not Release 01 baseline"
    # The snapshot reference renders uppercase as 'VS4A35F5596951...JSON' due to
    # CSS text-transform on the comparison label. Match case-insensitively.
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "Snapshot reference shown on the page contains sha prefix '4a35f55' (case-insensitive; rendered as '4A35F55' in the uppercased comparison label) — this is the immediate-prior snapshot to current c9cc83fcaf43"
      - verify: "Comparison does NOT contain sha prefix '596cc188' (case-insensitive). That would indicate the page is still comparing against Release 01 baseline — the bug fixed in commit ef4d2ae."

  - name: "No card content changes between c9cc83fcaf43 and 4a35f5596951"
    # Both tranches are metadata-only (alt-text + VIRIN backfill on
    # c9cc83, title-format normalization on 4a35f5). card_id set is
    # identical between them.
    #
    # Rendered shape: 'ADDED' label + '(0)' count below it, then a
    # '── NONE ──' separator. Same for REMOVED. The verify text below
    # accepts either '(0)' or ': 0' or 'NONE' patterns to stay robust
    # against future styling tweaks.
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "Added section shows zero cards — either '(0)', ': 0', or a 'NONE' indicator"
      - verify: "Removed section shows zero cards — either '(0)', ': 0', or a 'NONE' indicator"
      - verify: "If a 'field-only changes' indicator is present, it shows ~122 cards changed (alt-text + VIRIN backfill). Note 2026-05-15: this indicator is NOT currently surfaced on prod — known gap tracked in the diff-page-arbitrary-pair-selection plan, not a regression. Skip this verify if absent."
