name: "Diff — populated comparison against immediate-prior snapshot"
description: |
  The /diff page compares the current manifest against the most recent
  PRIOR snapshot under /data/snapshots/. As of 2026-06-02 we have eight
  snapshots committed (596cc188, 0d7e9ba1, 65572b38, 4a35f5596951,
  c9cc83fcaf43, f75e2f7d, c3475435, 6be2c64e) so the page renders a
  populated comparison by default.

  History — earlier behavior compared against the OLDEST snapshot
  (Release 01 baseline), which produced a cumulative changelog
  instead of the per-tranche delta visitors expect. The 1-line fix
  in commit ef4d2ae switched the comparison to index.at(-2). The
  full snapshot-pair-selection plan
  (.paircoder/plans/diff-page-arbitrary-pair-selection.md) layers
  selectors + a timeline strip on top of this default — still queued.

  Tranche-pair sha references are derived from web/public/data/snapshots/
  index.json at the time this suite is run. Per-tranche cardinality
  assertions ("how many cards added in this delta") were removed
  2026-06-02 (Sprint 4 follow-up) because they require operator
  re-tuning every tranche cut — the shape-stable assertions in
  scenarios 1 + 2 already pin the load-bearing behavior.
tags: [regression, ui]
preconditions:
  - "App accessible at ${base_url}"

scenarios:
  - name: "Diff page loads and compares current vs immediate-prior snapshot"
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "Heading reads 'TRANCHE DIFF' or 'Tranche diff'"
      - verify: "Page shows either Added / Removed sections (with card titles linking to /card/[id]) OR an in-brand 'no card changes in this tranche' indicator"
      - verify: "Loading state ('LOADING SNAPSHOTS' or similar) was visible briefly then resolved"
      - check_console: "No errors. A 404 on /data/snapshots/index.json is NOT expected here (the file exists with 8 entries)"

  - name: "Comparison is against immediate-prior snapshot, not Release 01 baseline"
    # The snapshot reference renders uppercase due to CSS text-transform on
    # the comparison label. Match case-insensitively. The specific sha to
    # verify is the SECOND-TO-LAST entry in web/public/data/snapshots/index.json
    # (per the index.at(-2) selection in commit ef4d2ae). As of 2026-06-02
    # that's c34754351cdf24d2 (immediate-prior to current 6be2c64e760534a5).
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "Snapshot reference shown on the page contains sha prefix 'c3475435' (case-insensitive; rendered as 'C3475435' in the uppercased comparison label) — this is the immediate-prior snapshot to current 6be2c64e760534a5"
      - verify: "Comparison does NOT contain sha prefix '596cc188' (case-insensitive). That would indicate the page is still comparing against Release 01 baseline — the bug fixed in commit ef4d2ae."

  - name: "Added / Removed sections render in expected shape (no cardinality pin)"
    # Sprint 4 follow-up 2026-06-02: scenario 3 previously asserted
    # "No card content changes between c9cc83fcaf43 and 4a35f5596951"
    # with ~122 field-only changes -- specific to a tranche pair that
    # no longer exists in the active comparison window. Per-tranche
    # cardinality is inherently brittle; the shape-stable replacement
    # below verifies the section structure regardless of the actual
    # numbers.
    steps:
      - navigate: "${base_url}/diff"
      - wait: "2"
      - verify: "An 'ADDED' label is present (followed by a count in any format: '(N)', ': N', or 'NONE')"
      - verify: "A 'REMOVED' label is present (followed by a count in any format: '(N)', ': N', or 'NONE')"
      - verify: "If both ADDED and REMOVED show NONE / (0), the page does not crash or show a 'no data' error — a metadata-only tranche is a legitimate state"
