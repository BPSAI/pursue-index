name: "Chat — RAG with citations"
description: |
  End-to-end chat surface coverage. Anonymous-tier flow + citation
  rendering + abstention shortcut + BYOK settings panel.

  Some scenarios require a working backend (Voyage + Anthropic
  secrets bound on the Worker). When the backend isn't available
  locally, those scenarios will degrade to a graceful "service
  unavailable" message — divona should report the actual observed
  state rather than fail-by-fiat.
tags: [chat, regression, critical]
preconditions:
  - "App accessible at ${base_url}"
  - "Splash cookie set (visit ${base_url}/?preview=bps-launch first)"

scenarios:
  - name: "Chat route renders with empty state"
    steps:
      - navigate: "${base_url}/chat"
      - verify: "Heading reads 'Full-text search' or 'Chat' or similar — page is the chat surface"
      - verify: "Input field at the bottom is visible and focusable"
      - verify: "Suggested-query buttons or chips are visible (3+ examples)"
      - verify: "A Settings (gear) icon or link is visible in the chat panel"
      - check_console: "No errors except any expected font / preact warnings"

  - name: "Off-corpus query returns abstention"
    steps:
      - navigate: "${base_url}/chat"
      - fill:
          field: "chat input"
          value: "Did aliens build the pyramids?"
      - click: "Send / submit / enter button"
      - wait: "5"
      - verify: "Response contains 'The documents in this corpus do not address that' or equivalent"
      - verify: "Response does NOT speculate about pyramids or aliens"
      - verify: "No citation chips render (or only an empty citation block)"

  - name: "On-corpus query returns answer with citations"
    steps:
      - navigate: "${base_url}/chat"
      - fill:
          field: "chat input"
          value: "What does the Apollo 17 crew debriefing say about anomalous sightings?"
      - click: "Send / submit / enter button"
      - wait: "10"
      - verify: "Response streams in (text appears progressively, not all at once after long delay)"
      - verify: "Response contains at least one citation in the form [card_id:page] rendered as a chip or link"
      - verify: "Response cites card_id starting with '0b298cfc' (Apollo 17 NASA debriefing)"
      - verify: "Response distinguishes report vs conclusion (uses cautious phrasing like 'appears to' or 'the document presents')"

  - name: "Citation chip click-through"
    steps:
      - navigate: "${base_url}/chat"
      - fill:
          field: "chat input"
          value: "Apollo 17 light flashes"
      - click: "Send"
      - wait: "10"
      - click: "the first citation chip in the response"
      - wait: "2"
      - verify: "Browser navigated to /card/[id] of the cited card"
      - verify: "The OCR text panel on the card page has the matched terms highlighted (mark elements with signal-amber background)"

  - name: "Settings panel opens and shows BYOK key field"
    steps:
      - navigate: "${base_url}/chat"
      - click: "Settings (gear) icon"
      - verify: "A modal or drawer opens with provider toggle (Anonymous / BYOK)"
      - verify: "BYOK section shows a password-masked key input"
      - verify: "Save / clear / close buttons are present"
      - verify: "Trust note is visible: 'Your key never leaves the browser' or equivalent"

  - name: "BYOK key validation rejects malformed input"
    steps:
      - navigate: "${base_url}/chat"
      - click: "Settings"
      - fill:
          field: "Anthropic API key input"
          value: "not-a-real-key-just-text"
      - click: "Save"
      - verify: "Validation error visible: 'Invalid Anthropic key shape' or equivalent"
      - verify: "Key is NOT saved to localStorage (settings panel still shows empty/none state)"

  - name: "Rate-limit message is helpful when triggered"
    # This scenario is conditional — if you've already hit your daily cap,
    # the chat returns a 429 with a BYOK CTA. Not always reproducible without
    # exhausting the cap first; divona should report 'observed' or 'not reproduced'.
    steps:
      - navigate: "${base_url}/chat"
      - verify: "If a 429-style 'daily limit reached' message appears, it explicitly mentions BYOK in Settings as the next step"
