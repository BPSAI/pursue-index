name: "Smoke — pursueindex"
description: |
  Critical-path smoke test. Every public route loads, the manifest
  renders, no console errors. Run this before every deploy to a public
  domain; it catches gross regressions in <2 minutes.
tags: [critical, smoke]
preconditions:
  - "App accessible at ${base_url} (navigate succeeds, no 5xx)"

scenarios:
  - name: "Index loads with manifest data"
    steps:
      - navigate: "${base_url}/"
      - verify: "Header shows the PURSUE://INDEX lockup with a green caret"
      - verify: "Hero panel is visible with a 'cat /var/dow/pursue/release-01.manifest' line and the agency tally chips"
      - verify: "At least 100 card tiles are rendered in the grid (manifest has 161)"
      - verify: "Footer shows TS, CSV_SHA256 (12-char prefix), N (card count), SRC, IDX"
      - check_console: "No errors and no warnings other than dev-server hot-reload chatter"

  - name: "Each top-level route loads"
    steps:
      - navigate: "${base_url}/search"
      - verify: "Search heading 'Full-text search' visible and an input is focused or focusable"
      - check_console: "No errors"
      - navigate: "${base_url}/diff"
      - verify: "Tranche diff heading visible and an empty-state panel explaining 'No prior snapshot yet'"
      - check_console: "No errors"
      - navigate: "${base_url}/about"
      - verify: "About page renders with brand-consistent layout (terminal aesthetic, mono headings)"
      - navigate: "${base_url}/methodology"
      - verify: "Methodology page renders with brand-consistent layout"

  - name: "404 page is in-brand"
    steps:
      - navigate: "${base_url}/this-route-does-not-exist"
      - verify: "Custom terminal-style 404 page renders (not the default Astro/server 404)"
      - verify: "There is a way to navigate back to the index from the 404 page"

  - name: "Card detail loads for a known card"
    steps:
      - navigate: "${base_url}/card/0b298cfc9c65a4d6"
      - verify: "Page header shows 'Apollo 17' or related title text"
      - verify: "Breadcrumb shows /INDEX / CARD / <id-prefix>"
      - verify: "Asset URL link to war.gov is visible"
      - verify: "PDF preview iframe is present (or a fallback message if the iframe failed to load)"
      - check_console: "No errors except expected mixed-content/iframe warnings from war.gov"
