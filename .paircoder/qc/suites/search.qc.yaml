name: "Search — MiniSearch over OCR text"
description: |
  Full-text search across the 4,153 OCR'd pages. Tests the data-load
  path (graceful 'OCR pending' empty state when /data/pages.json is
  absent), keyboard niceties (/ focus, esc clear), result rendering,
  and link-out to the matching card.
tags: [regression, ui, search]
preconditions:
  - "App accessible at ${base_url}"

scenarios:
  - name: "Search loads the OCR index and reports page count"
    steps:
      - navigate: "${base_url}/search"
      - wait: "2"
      - verify: "Loading state ('DECLASSIFYING…' or sweep-bar) appears briefly, then resolves"
      - verify: "Once loaded, page-count line reads '4,153 · PAGES INDEXED' (or close)"
      - verify: "A '/' kbd badge is shown inside or beside the search input"

  - name: "Slash keyboard shortcut focuses the input"
    steps:
      - navigate: "${base_url}/search"
      - wait: "2"
      - click: "anywhere outside the search input (e.g., page heading)"
      - wait: "1"
      # press the / key on the keyboard; divona will translate this to a key event
      - verify: "Pressing '/' focuses the search input (active element is the search field)"

  - name: "Escape clears the query"
    steps:
      - navigate: "${base_url}/search"
      - wait: "2"
      - fill:
          field: "search input"
          value: "roswell"
      - wait: "1"
      - verify: "Result rows are visible"
      - verify: "Pressing Escape with the input focused clears the query and the result list"

  - name: "Search produces relevant matches with link-out"
    steps:
      - navigate: "${base_url}/search"
      - wait: "2"
      - fill:
          field: "search input"
          value: "apollo"
      - wait: "1"
      - verify: "At least one result row is rendered with the Apollo-related card title"
      - verify: "Each result row shows P{page} · SCORE {n.nn} · {card_id-prefix}"
      - click: "the first result row"
      - wait: "1"
      - verify: "Browser navigates to /card/{card_id}#page-{n}"

  - name: "Capped results indicator at >50 matches"
    steps:
      - navigate: "${base_url}/search"
      - wait: "2"
      - fill:
          field: "search input"
          value: "the"
      - wait: "1"
      - verify: "If more than 50 matches, a '(CAPPED)' indicator is shown"
