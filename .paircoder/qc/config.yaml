# QC environment profiles for pursueindex.
#
# Divona (the QC agent) reads this to resolve ${VAR}-style substitutions in
# suite specs and to honor read-only mode on prod.
#
# Choose env based on what you're testing:
#   prod  -- default. What users actually see. Use for regression sweeps
#            and content verification. Includes the Cloudflare Worker
#            (/pdf/<id>.pdf, /api/*, redirects via alias chain).
#   dev   -- localhost. Use for pre-push verification of new components,
#            form submissions, hot-reload work. CAVEAT: any /pdf/<id>.pdf
#            iframe will 404 because the Cloudflare Worker isn't running
#            (Astro dev only serves /web routes). Scenarios that depend
#            on worker-served content should target prod instead.

default_environment: prod

environments:
  prod:
    base_url: "https://pursueindex.com"
    description: "Public production site. READ-ONLY by policy."
    restrictions:
      read_only: true
      skip_tags: ["destructive", "form-submit"]
    notes: |
      Live on Cloudflare Pages + Worker. Default env for regression
      sweeps. Worker serves /pdf/<id>.pdf from R2 (200 + application/pdf);
      alias redirects work; /api/* dispatch active. No login required.
      Read-only mode honored: no form-submit, no destructive actions.

  dev:
    base_url: "http://localhost:4321"
    description: "Local Astro dev server (npm run dev from /web). Pre-push only."
    restrictions:
      read_only: false
      skip_tags: ["requires-worker"]
    notes: |
      Run `cd web && npm run dev` before invoking divona on this env.
      Hot-reload is fine; allow ~1s settle after navigations.

      CAVEAT: the Cloudflare Worker is not running locally. Any
      scenario that loads /pdf/<id>.pdf, /api/*, or alias redirects
      will see a 404 in dev (the Astro dev server doesn't serve those
      paths). Tag such scenarios `requires-worker` and they'll be
      skipped automatically here. Use dev for component-level work;
      use prod for end-to-end content verification.

  staging:
    base_url: "https://fantastic-bassoon-k5j8o45.pages.github.io"
    description: "Private GH Pages preview. Requires GitHub auth."
    restrictions:
      read_only: true
      skip_tags: []
    notes: |
      Auth-gated. Divona may need a manual login pause if a fresh
      session is required. Mostly superseded by `prod` (which is now
      live on Cloudflare Pages); keep around for the rare case of
      testing an unmerged staging build.

defaults:
  timeout_seconds: 10
  navigation_settle_ms: 800
  screenshot_on_failure: true

suites_dir: ".paircoder/qc/suites"
reports_dir: ".paircoder/qc/reports"
