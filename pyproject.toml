[project]
name = "pursue-index"
version = "0.1.0"
description = "Searchable index of DOW PURSUE UAP document releases"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BPS AI Software", email = "david@bpsaisoftware.com" }]
license = { text = "Proprietary" }

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Scrape
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # Download
    "tenacity>=8.4",
    # OCR
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pillow>=10.3",
    "pypdfium2>=4.30",
    # Index / DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1.0.0b3",
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
]

[project.scripts]
pursue = "pursue_index.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursue_index"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
