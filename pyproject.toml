[project]
name = "pursue-index"
version = "0.2.0"
description = "Searchable index of DOW PURSUE UAP document releases"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BPS AI Software", email = "david@bpsaisoftware.com" }]
license = "Apache-2.0"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "python-dotenv>=1.0",
    "tenacity>=8.4",
    # OCR
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    # Pillow 11.1.0 patches CVE-2024-28219 (ImagingResampleHorizontal
    # buffer overflow in the C extension), which is on the rotation
    # path used by ``src/pursue_index/web/og_layers.py::declassified_stamp``
    # (Image.BICUBIC resample). Do not relax this lower bound without
    # confirming the patched series.
    "pillow>=11.1.0",
    "pypdfium2>=4.30",
    # Index / DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1.0.0b3",
    "azure-identity>=1.17",
]
gpu = [
    # Surya is the transformer-OCR engine for the local 5090. Pulls in torch +
    # CUDA wheels (~3 GB); install only on hosts with a CUDA-capable GPU.
    #
    # Known conflict (2026-05): surya-ocr 0.17.1 pins ``pillow<11.0.0``, but
    # the core dependency now requires ``pillow>=11.1.0`` (CVE-2024-28219).
    # Until surya releases a Pillow-11-compatible build, install the gpu
    # extra in a separate venv (`uv pip install pursue-index[gpu] --resolution=lowest`)
    # or with ``pip install --no-deps surya-ocr==0.17.1``. The CVE-affected
    # resampler is on the og_image build path, not the OCR path, so the
    # security gap on a gpu-only OCR host is bounded.
    "surya-ocr>=0.17",
    # surya-ocr 0.17.x is incompatible with transformers 5.x; pip will resolve
    # to 5.8 by default and break import. Pin until surya catches up.
    # NOTE: this <5 ceiling is also load-bearing for CVE-2026-1839 acceptance —
    # see SECURITY.md "Documented exceptions" before relaxing.
    "transformers>=4.56,<5",
]
llm = [
    # LLM-based OCR fallback for low-confidence pages. The Anthropic SDK is
    # the v1 implementation; the OpenAI provider is a stub for v2.
    "anthropic>=0.40",
]
embed = [
    # Voyage-3 embeddings for the chat retrieval surface (embed-stage plan).
    # OpenAI text-embedding-3-large is wired as a stub for v2 A/B testing.
    "voyageai>=0.3",
    "numpy>=2.0",
]
build-tools = [
    # Build-time only — used by ``scripts/build_atlas_layout.py`` to produce
    # ``web/public/data/atlas-layout.json`` for the /atlas semantic browser.
    # NOT a runtime dependency: the projection is a static asset, the browser
    # never sees umap-learn. Pin a sane lower bound so reviewers don't get
    # surprise layout drift across minor releases.
    "umap-learn>=0.5,<0.6",
    "numpy>=2.0",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
]

[project.scripts]
pursue = "pursue_index.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursue_index"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
