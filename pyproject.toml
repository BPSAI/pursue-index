[project]
name = "pursue-index"
version = "0.2.0"
description = "Searchable index of DOW PURSUE UAP document releases"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BPS AI Software", email = "david@bpsaisoftware.com" }]
license = "Apache-2.0"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "python-dotenv>=1.0",
    "tenacity>=8.4",
    # OCR
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pillow>=10.3",
    "pypdfium2>=4.30",
    # Index / DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1.0.0b3",
    "azure-identity>=1.17",
]
gpu = [
    # Surya is the transformer-OCR engine for the local 5090. Pulls in torch +
    # CUDA wheels (~3 GB); install only on hosts with a CUDA-capable GPU.
    "surya-ocr>=0.17",
    # surya-ocr 0.17.x is incompatible with transformers 5.x; pip will resolve
    # to 5.8 by default and break import. Pin until surya catches up.
    "transformers>=4.56,<5",
]
llm = [
    # LLM-based OCR fallback for low-confidence pages. The Anthropic SDK is
    # the v1 implementation; the OpenAI provider is a stub for v2.
    "anthropic>=0.40",
]
embed = [
    # Voyage-3 embeddings for the chat retrieval surface (embed-stage plan).
    # OpenAI text-embedding-3-large is wired as a stub for v2 A/B testing.
    "voyageai>=0.3",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
]

[project.scripts]
pursue = "pursue_index.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursue_index"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
